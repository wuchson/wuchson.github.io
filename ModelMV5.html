<style>
:root{
  --pink:#ff6b95;
  --pink2:#ffb3c6;
  --bg:#fff5f7;
  --line:#f7d6e0;
  --ink:#3d242b;
  --dark:#1f0d13;
  --accent:#ff477e;
}
*{box-sizing:border-box}

body{
  margin:0;
  font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;
  background:linear-gradient(135deg,#fff8fa,#ffe6ed);
  color:var(--ink);
}

header{
  background:linear-gradient(120deg,var(--pink),var(--pink2));
  color:white;
  padding:24px 20px;
  text-align:center;
}

.wrap{
  max-width:1300px;
  margin:auto;
}

h1{
  margin:0;
  font-size:26px;
}

header p{
  margin:8px 0 0;
  opacity:.95;
  font-size:14px;
}

.app{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px;
  padding:24px 20px 42px;
}

.panel{
  background:#ffffff;
  border:2px solid var(--line);
  border-radius:24px;
  padding:22px;
  box-shadow:0 10px 30px #ff6b9515;
}

.title{
  font-size:18px;
  font-weight:800;
  margin:12px 0 16px;
  padding-bottom:8px;
  border-bottom:2px dashed #f7d6e0;
  color:#e04872;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.group{
  margin-bottom:16px;
}

label{
  display:block;
  font-weight:800;
  margin-bottom:6px;
  font-size:13px;
  color:#522835;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

select,
input[type=text],
textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px 12px;
  background:#fff5f7;
  font:inherit;
  color:var(--ink);
  font-size:13px;
}

textarea{
  resize:vertical;
}

.checks{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.check{
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 12px;
  background:#fff0f3;
  border:1px solid var(--line);
  border-radius:999px;
  font-size:12px;
}

.check input{
  accent-color:var(--pink);
}

.preview{
  position:sticky;
  top:16px;
}

.tab-btn-group{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}

.tab-btn{
  flex:1;
  padding:10px;
  border-radius:12px;
  border:2px solid var(--pink2);
  background:#fff;
  color:var(--ink);
  font-weight:800;
  cursor:pointer;
  font-size:13px;
}

.tab-btn.active{
  background:var(--pink);
  color:#fff;
  border-color:var(--pink);
}

.previewbox{
  background:var(--dark);
  padding:14px;
  border-radius:20px;
}

#prompt{
  min-height:300px;
  background:#1a080d;
  color:#ffdeeb;
  border-color:#5e2233;
  line-height:1.5;
  font-size:13px;
}

/* 模擬生成 Canvas 區域 */
.sim-area{
  margin-top:16px;
  background:#fff0f4;
  border:2px dashed var(--pink2);
  border-radius:18px;
  padding:14px;
  text-align:center;
}

.canvas-container{
  position:relative;
  width:100%;
  max-width:260px;
  height:360px;
  margin:10px auto;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 8px 20px rgba(0,0,0,0.15);
  background:#222;
}

#simCanvas{
  width:100%;
  height:100%;
  object-fit:cover;
}

.badge{
  position:absolute;
  top:10px;
  left:10px;
  background:rgba(255,107,149,0.85);
  color:#fff;
  padding:4px 10px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
  backdrop-filter:blur(4px);
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

button{
  padding:10px;
  border:0;
  border-radius:12px;
  font-weight:800;
  cursor:pointer;
  font-size:13px;
  transition:transform 0.1s, background 0.2s;
}

button:active{
  transform:scale(0.98);
}

.primary{
  background:linear-gradient(135deg,var(--pink),var(--pink2));
  color:#fff;
  box-shadow:0 4px 12px #ff6b9540;
}

.secondary{
  background:#ffeef2;
  color:#c73860;
}

.success{
  background:#28a745;
  color:#fff;
}

.dark{
  background:#4a1928;
  color:#fff;
}

@media(max-width:1000px){
  .app{ grid-template-columns:1fr; }
  .preview{ position:static; }
}

@media(max-width:600px){
  .grid{ grid-template-columns:1fr; }
}
</style>
</head>

<body>

<header>
<div class="wrap">

</div>
</header>

<div class="wrap app">

</div>

  </div>
  <div class="group">

  </div>
</div>

<div class="grid">
  <div class="group">
    <label>3. 毛色、毛型與花紋</label>
    <select id="hairStyle"></select>
  </div>
  <div class="group">
    <label>4. 動物體型與比例</label>
    <select id="bodyType"></select>
  </div>
</div>

<div class="group">
  <label>5. 女生動物穿搭與配件</label>
  <select id="outfit"></select>
</div>

<!-- ② 音樂與唱歌 -->
<div class="title">② 音樂與動物唱跳風格</div>

  <div class="group">

  </div>

<div class="group">

<textarea id="custom" rows="2" placeholder="例如：粉色蝴蝶結、蓬鬆尾巴、肉球腳掌、角色個性……"></textarea>

</main>

<aside class="panel preview">

<div class="previewbox">

  <button class="dark" id="reset" style="grid-column: span 2;">↺ 重設所有設定</button>
</div>

</aside>

</div>

const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
let currentImgData = null;
let animTimer = null;
let isAnimating = false;

// 初始化畫布
function initCanvas(){
  ctx.fillStyle = "#ffeef2";
  ctx.fillRect(0,0,260,360);
  ctx.fillStyle = "#ff6b95";
  ctx.font = "bold 14px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("✨ 點擊下方「生成角色照片」", 130, 170);
  ctx.fillText("體驗先圖後影自動流程", 130, 195);

function generateImage(){
  if(isAnimating) stopAnimation();
  document.getElementById('simBadge').textContent = "1. 已生成角色圖片";
  
  // 繪製模擬的 AI 萌系女生動物角色卡片
  ctx.fillStyle = "#ffdae3";
  ctx.fillRect(0,0,260,360);
  
  // 背景星光裝飾
  ctx.fillStyle = "#ffffff";
  for(let i=0; i<15; i++){
    ctx.beginPath();
    ctx.arc(Math.random()*260, Math.random()*360, Math.random()*3+1, 0, Math.PI*2);
    ctx.fill();
  }

  // 動物角色頭部裝飾（示意）
  ctx.fillStyle = "#ff7597";
  ctx.beginPath();
  ctx.arc(130, 130, 75, 0, Math.PI*2);
  ctx.fill();

  // 臉型
  ctx.fillStyle = "#fff0e6";
  ctx.beginPath();
  ctx.arc(130, 140, 50, 0, Math.PI*2);
  ctx.fill();

  // 腮紅
  ctx.fillStyle = "#ffb3c6";
  ctx.beginPath();
  ctx.arc(105, 150, 10, 0, Math.PI*2);
  ctx.arc(155, 150, 10, 0, Math.PI*2);
  ctx.fill();

  // 眼睛
  ctx.fillStyle = "#3d242b";
  ctx.beginPath();
  ctx.arc(110, 135, 7, 0, Math.PI*2);
  ctx.arc(150, 135, 7, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.arc(112, 133, 2.5, 0, Math.PI*2);
  ctx.arc(152, 133, 2.5, 0, Math.PI*2);
  ctx.fill();

  // 甜美微笑
  ctx.strokeStyle = "#e04872";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(130, 150, 8, 0.1*Math.PI, 0.9*Math.PI);
  ctx.stroke();

  // 裙裝主體
  ctx.fillStyle = "#ff477e";
  ctx.beginPath();
  ctx.moveTo(95, 185);
  ctx.lineTo(165, 185);
  ctx.lineTo(185, 290);
  ctx.lineTo(75, 290);
  ctx.closePath();
  ctx.fill();

  // 儲存快照
  currentImgData = ctx.getImageData(0, 0, 260, 360);
  document.getElementById('btnAnim').disabled = false;
}

function generateVideo(){
  if(!currentImgData) return;
  document.getElementById('simBadge').textContent = "2. 🎬 唱跳 MV 播放中";
  stopAnimation();
  
  let frame = 0;
  isAnimating = true;
  
  animTimer = setInterval(() => {
    frame++;
    ctx.putImageData(currentImgData, 0, 0);
    
    // 模擬動態擺動與對嘴效果
    const offsetY = Math.sin(frame * 0.15) * 6;
    const eyeWink = Math.sin(frame * 0.1) > 0.8;
    
    // 清除區域重新繪製擺動頭部
    ctx.fillStyle = "#fff0e6";
    ctx.beginPath();
    ctx.arc(130, 140 + offsetY, 50, 0, Math.PI*2);
    ctx.fill();

    // 腮紅
    ctx.fillStyle = "#ffb3c6";
    ctx.beginPath();
    ctx.arc(105, 150 + offsetY, 10, 0, Math.PI*2);
    ctx.arc(155, 150 + offsetY, 10, 0, Math.PI*2);
    ctx.fill();

    // 眨眼/大眼
    ctx.fillStyle = "#3d242b";
    if(eyeWink){
      ctx.fillRect(103, 133 + offsetY, 14, 3);
      ctx.beginPath();
      ctx.arc(150, 135 + offsetY, 7, 0, Math.PI*2);
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(110, 135 + offsetY, 7, 0, Math.PI*2);
      ctx.arc(150, 135 + offsetY, 7, 0, Math.PI*2);
      ctx.fill();
    }

    // 萌感嘴型變化 (唱歌對嘴)
    const mouthOpen = Math.abs(Math.sin(frame * 0.2)) * 6 + 3;
    ctx.fillStyle = "#e04872";
    ctx.beginPath();
    ctx.ellipse(130, 155 + offsetY, 6, mouthOpen, 0, 0, Math.PI*2);
    ctx.fill();

    // 飄落愛心特效
    ctx.fillStyle = "rgba(255, 107, 149, 0.7)";
    const heartY = (frame * 4) % 360;
    ctx.beginPath();
    ctx.arc((frame*3)%260, heartY, 6, 0, Math.PI*2);
    ctx.fill();

  }, 50);
}

function stopAnimation(){
  if(animTimer) clearInterval(animTimer);
  isAnimating = false;
}

function loadCustomImage(e){
  const file = e.target.files[0];
  if(!file) return;
  const img = new Image();
  img.onload = () => {
    stopAnimation();
    ctx.drawImage(img, 0, 0, 260, 360);
    currentImgData = ctx.getImageData(0, 0, 260, 360);
    document.getElementById('simBadge').textContent = "1. 自訂圖片已上傳";
    document.getElementById('btnAnim').disabled = false;
  };
  img.src = URL.createObjectURL(file);
}

/* 即時監聽選項 */
document.querySelectorAll('select, input[type=text], textarea, input[type=checkbox]').forEach(el => {
  el.addEventListener('input', makePrompt);
  el.addEventListener('change', makePrompt);
});

/* 複製 Prompt */
document.getElementById('copy').onclick = async () => {
  try {
    await navigator.clipboard.writeText(document.getElementById('prompt').value);
    const btn = document.getElementById('copy');
    btn.textContent = '✓ 已複製當前指令';
    setTimeout(() => { btn.textContent = '📋 複製當前指令'; }, 1500);
  } catch(e) {
    alert('複製失敗，請手動複製右側指令。');
  }
};

/* 儲存/匯出/匯入/重設 */
function getSettingsData(){
  const data = { version:6, settings:{} };
  document.querySelectorAll('select, input[type=text], textarea').forEach(el => {
    data.settings[el.id] = el.value;
  });
  data.settings.checks = checked();
  return data;
}

document.getElementById('save').onclick = () => {
  localStorage.setItem('danceMVGenerator_img2vid', JSON.stringify(getSettingsData()));
  alert('女生動物設定已儲存！');
};

document.getElementById('exportSettings').onclick = () => {
  const blob = new Blob([JSON.stringify(getSettingsData(), null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'Cute_Animal_Girl_MV_Settings.json';
  a.click();
  URL.revokeObjectURL(url);
};

document.getElementById('importSettings').onclick = () => document.getElementById('importFile').click();

document.getElementById('importFile').addEventListener('change', function(){
  const file = this.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const raw = JSON.parse(reader.result);
      const data = raw.settings || raw;
      Object.keys(data).forEach(id => {
        const el = document.getElementById(id);
        if(el && id !== 'checks') el.value = data[id];
      });
      makePrompt();
      alert('女生動物設定匯入成功！');
    } catch(e) { alert('格式錯誤。'); }
  };
  reader.readAsText(file);
});

document.getElementById('reset').onclick = () => {
  if(!confirm('確定要重設為初始女生動物設定嗎？')) return;
  document.querySelectorAll('select').forEach(el => el.selectedIndex = 0);
  document.querySelectorAll('input[type=text], textarea').forEach(el => el.value = '');
  stopAnimation();
  initCanvas();
  makePrompt();
};

/* 啟動 */
initOptions();
initCanvas();
makePrompt();
