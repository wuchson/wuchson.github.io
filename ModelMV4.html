<style>
:root{

  --bg:#f1f5f9;
  --line:#cbd5e1;
  --ink:#172033;
  --dark:#0f172a;
  --accent:#334155;
}
*{box-sizing:border-box}

body{
  margin:0;
  font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;
  background:linear-gradient(135deg,#f8fafc,#e2e8f0);
  color:var(--ink);
}

header{
  background:linear-gradient(120deg,#0f172a,#475569);
  color:white;
  padding:24px 20px;
  text-align:center;
}

.wrap{
  max-width:1300px;
  margin:auto;
}

h1{
  margin:0;
  font-size:26px;
}

header p{
  margin:8px 0 0;
  opacity:.95;
  font-size:14px;
}

.app{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px;
  padding:24px 20px 42px;
}

.panel{
  background:#ffffff;
  border:2px solid var(--line);
  border-radius:24px;
  padding:22px;
  box-shadow:0 10px 30px #0f172a12;
}

.title{
  font-size:18px;
  font-weight:800;
  margin:12px 0 16px;
  padding-bottom:8px;
  border-bottom:2px dashed #cbd5e1;
  color:#2563eb;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.group{
  margin-bottom:16px;
}

label{
  display:block;
  font-weight:800;
  margin-bottom:6px;
  font-size:13px;
  color:#334155;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

select,
input[type=text],
textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px 12px;
  background:#f8fafc;
  font:inherit;
  color:var(--ink);
  font-size:13px;
}

textarea{
  resize:vertical;
}

.checks{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.check{
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 12px;
  background:#eef5ff;
  border:1px solid var(--line);
  border-radius:999px;
  font-size:12px;
}

.check input{
  accent-color:var(--pink);
}

.preview{
  position:sticky;
  top:16px;
}

.tab-btn-group{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}

.tab-btn{
  flex:1;
  padding:10px;
  border-radius:12px;
  border:2px solid var(--pink2);
  background:#fff;
  color:var(--ink);
  font-weight:800;
  cursor:pointer;
  font-size:13px;
}

.tab-btn.active{
  background:var(--pink);
  color:#fff;
  border-color:var(--pink);
}

.previewbox{
  background:var(--dark);
  padding:14px;
  border-radius:20px;
}

#prompt{
  min-height:300px;
  background:#08111f;
  color:#dbeafe;
  border-color:#1e3a5f;
  line-height:1.5;
  font-size:13px;
}

/* 模擬生成 Canvas 區域 */
.sim-area{
  margin-top:16px;
  background:#eff6ff;
  border:2px dashed var(--pink2);
  border-radius:18px;
  padding:14px;
  text-align:center;
}

.canvas-container{
  position:relative;
  width:100%;
  max-width:260px;
  height:360px;
  margin:10px auto;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 8px 20px rgba(0,0,0,0.15);
  background:#222;
}

#simCanvas{
  width:100%;
  height:100%;
  object-fit:cover;
}

.badge{
  position:absolute;
  top:10px;
  left:10px;
  background:rgba(30,41,59,0.88);
  color:#fff;
  padding:4px 10px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
  backdrop-filter:blur(4px);
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

button{
  padding:10px;
  border:0;
  border-radius:12px;
  font-weight:800;
  cursor:pointer;
  font-size:13px;
  transition:transform 0.1s, background 0.2s;
}

button:active{
  transform:scale(0.98);
}

.primary{
  background:linear-gradient(135deg,var(--pink),var(--pink2));
  color:#fff;
  box-shadow:0 4px 12px #3b82f640;
}

.secondary{
  background:#eef5ff;
  color:#2563eb;
}

.success{
  background:#28a745;
  color:#fff;
}

.dark{
  background:#172554;
  color:#fff;
}

@media(max-width:1000px){
  .app{ grid-template-columns:1fr; }
  .preview{ position:static; }
}

@media(max-width:600px){
  .grid{ grid-template-columns:1fr; }
}
</style>
</head>

<body>

<header>
<div class="wrap">
<h1>⚡ AI 男生潮流唱跳 MV 生成器（先圖後影版）</h1>
<p>先生成高畫質男性角色圖，再轉為動態唱跳 MV；強化男性穿搭、舞台場景、街頭律動與角色一致性。</p>
</div>
</header>

<div class="wrap app">

<main class="panel">

<!-- 一鍵靈感 -->
<div style="background:#eef5ff; border:1px solid #bfdbfe; padding:12px; border-radius:16px; margin-bottom:15px; display:flex; gap:8px;">
  <button class="primary" style="flex:1" onclick="randomizeCharacter()">🎲 隨機男生造型</button>
  <button class="secondary" style="flex:1" onclick="randomizeAll()">⚡ 潮流全隨機（含舞台與舞蹈）</button>
</div>

<!-- ① 人物造型 -->
<div class="title">
  <span>① 可愛男生造型 (繪圖標準設定)</span>
</div>

<div class="grid">
  <div class="group">
    <label>1. 男生氣質 (52款)</label>
    <select id="gender"></select>
  </div>
  <div class="group">
    <label>2. 五官臉型 (51款)</label>
    <select id="faceShape"></select>
  </div>
</div>

<div class="grid">
  <div class="group">
    <label>3. 髮型髮色 (51款)</label>
    <select id="hairStyle"></select>
  </div>
  <div class="group">
    <label>4. 男生身型 (51款)</label>
    <select id="bodyType"></select>
  </div>
</div>

<div class="group">
  <label>5. 男生穿搭風格 (51款)</label>
  <select id="outfit"></select>
</div>

<!-- ② 音樂與唱歌 -->
<div class="title">② 音樂與唱跳風格</div>

<div class="grid">
  <div class="group">
    <label>萌系曲風 (52款)</label>
    <select id="musicType"></select>
  </div>

    <label>音樂節奏</label>

      <option value="軟萌律動 (80-100 BPM)，自然可愛擺動">軟萌律動 (80-100 BPM)</option>
      <option value="夢幻溫柔 (60-80 BPM)，治癒系抒情搖擺">夢幻溫柔 (60-80 BPM)</option>
    </select>
  </div>
</div>

<div class="group">
  <label>指定歌曲名稱/關鍵字 (選填)</label>
  <input id="song" type="text" placeholder="例如：可愛日系動漫歌、抖音熱門萌舞曲……">
</div>

<!-- ③ 美術視覺與舞蹈 -->
<div class="title">③ 美術視覺與潮流舞蹈</div>

<div class="grid">

<div class="previewbox">

</div>

</aside>

</div>

let currentTab = 'img';

function initOptions(){
  for(let key in OPTIONS_DB){
    const select = document.getElementById(key);
    if(!select) continue;
    select.innerHTML = "";
    OPTIONS_DB[key].forEach((item, index) => {
      const opt = document.createElement('option');
      opt.value = item;
      opt.textContent = `${index + 1}. ${item}`;
      select.appendChild(opt);
    });
  }
}

const checked = () => [...document.querySelectorAll('.check input:checked')].map(x=>x.value);

/* Canvas 模擬 AI 生成圖片與動畫機制 */
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
let currentImgData = null;
let animTimer = null;
let isAnimating = false;

// 初始化畫布
function initCanvas(){
  ctx.fillStyle = "#eef5ff";
  ctx.fillRect(0,0,260,360);
  ctx.fillStyle = "#334155";
  ctx.font = "bold 14px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("⚡ 點擊下方「生成角色照片」", 130, 170);
  ctx.fillText("體驗先圖後影 MV 流程", 130, 195);
}

function generateImage(){
  if(isAnimating) stopAnimation();
  document.getElementById('simBadge').textContent = "1. 已生成角色圖片";
  
  // 繪製模擬的 AI 萌系美少年卡片
  ctx.fillStyle = "#ffdae3";
  ctx.fillRect(0,0,260,360);
  
  // 背景星光裝飾
  ctx.fillStyle = "#ffffff";
  for(let i=0; i<15; i++){
    ctx.beginPath();
    ctx.arc(Math.random()*260, Math.random()*360, Math.random()*3+1, 0, Math.PI*2);
    ctx.fill();
  }

  // 美少年頭髮
  ctx.fillStyle = "#1e293b";
  ctx.beginPath();
  ctx.arc(130, 130, 75, 0, Math.PI*2);
  ctx.fill();

  // 臉型
  ctx.fillStyle = "#fff0e6";
  ctx.beginPath();
  ctx.arc(130, 140, 50, 0, Math.PI*2);
  ctx.fill();

  // 腮紅
  ctx.fillStyle = "#cbd5e1";
  ctx.beginPath();
  ctx.arc(105, 150, 10, 0, Math.PI*2);
  ctx.arc(155, 150, 10, 0, Math.PI*2);
  ctx.fill();

  // 眼睛
  ctx.fillStyle = "#3d242b";
  ctx.beginPath();
  ctx.arc(110, 135, 7, 0, Math.PI*2);
  ctx.arc(150, 135, 7, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.arc(112, 133, 2.5, 0, Math.PI*2);
  ctx.arc(152, 133, 2.5, 0, Math.PI*2);
  ctx.fill();

  // 甜美微笑
  ctx.strokeStyle = "#334155";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(130, 150, 8, 0.1*Math.PI, 0.9*Math.PI);
  ctx.stroke();

  // 男生上衣主體
  ctx.fillStyle = "#475569";
  ctx.beginPath();
  ctx.moveTo(95, 185);
  ctx.lineTo(165, 185);
  ctx.lineTo(185, 290);
  ctx.lineTo(75, 290);
  ctx.closePath();
  ctx.fill();

  // 儲存快照
  currentImgData = ctx.getImageData(0, 0, 260, 360);
  document.getElementById('btnAnim').disabled = false;
}

function generateVideo(){
  if(!currentImgData) return;
  document.getElementById('simBadge').textContent = "2. 🎬 唱跳 MV 播放中";
  stopAnimation();
  
  let frame = 0;
  isAnimating = true;
  
  animTimer = setInterval(() => {
    frame++;
    ctx.putImageData(currentImgData, 0, 0);
    
    // 模擬動態擺動與對嘴效果
    const offsetY = Math.sin(frame * 0.15) * 6;
    const eyeWink = Math.sin(frame * 0.1) > 0.8;
    
    // 清除區域重新繪製擺動頭部
    ctx.fillStyle = "#fff0e6";
    ctx.beginPath();
    ctx.arc(130, 140 + offsetY, 50, 0, Math.PI*2);
    ctx.fill();

    // 腮紅
    ctx.fillStyle = "#cbd5e1";
    ctx.beginPath();
    ctx.arc(105, 150 + offsetY, 10, 0, Math.PI*2);
    ctx.arc(155, 150 + offsetY, 10, 0, Math.PI*2);
    ctx.fill();

    // 眨眼/大眼
    ctx.fillStyle = "#3d242b";
    if(eyeWink){
      ctx.fillRect(103, 133 + offsetY, 14, 3);
      ctx.beginPath();
      ctx.arc(150, 135 + offsetY, 7, 0, Math.PI*2);
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(110, 135 + offsetY, 7, 0, Math.PI*2);
      ctx.arc(150, 135 + offsetY, 7, 0, Math.PI*2);
      ctx.fill();
    }

    // 萌感嘴型變化 (唱歌對嘴)
    const mouthOpen = Math.abs(Math.sin(frame * 0.2)) * 6 + 3;
    ctx.fillStyle = "#2563eb";
    ctx.beginPath();
    ctx.ellipse(130, 155 + offsetY, 6, mouthOpen, 0, 0, Math.PI*2);
    ctx.fill();

    // 飄落愛心特效
    ctx.fillStyle = "rgba(96, 165, 250, 0.7)";
    const heartY = (frame * 4) % 360;
    ctx.beginPath();
    ctx.arc((frame*3)%260, heartY, 6, 0, Math.PI*2);
    ctx.fill();

  }, 50);
}

function stopAnimation(){
  if(animTimer) clearInterval(animTimer);
  isAnimating = false;
}

function loadCustomImage(e){
  const file = e.target.files[0];
  if(!file) return;
  const img = new Image();
  img.onload = () => {
    stopAnimation();
    ctx.drawImage(img, 0, 0, 260, 360);
    currentImgData = ctx.getImageData(0, 0, 260, 360);
    document.getElementById('simBadge').textContent = "1. 自訂圖片已上傳";
    document.getElementById('btnAnim').disabled = false;
  };
  img.src = URL.createObjectURL(file);
}

/* 複製 Prompt */

    const btn = document.getElementById('copy');
    btn.textContent = '✓ 已複製當前指令';
    setTimeout(() => { btn.textContent = '📋 複製當前指令'; }, 1500);

    alert('複製失敗，請手動複製右側指令。');
  }
};

/* 儲存/匯出/匯入/重設 */
function getSettingsData(){
  const data = { version:5, settings:{} };
  document.querySelectorAll('select, input[type=text], textarea').forEach(el => {
    data.settings[el.id] = el.value;
  });
  data.settings.checks = checked();
  return data;
}

document.getElementById('save').onclick = () => {
  localStorage.setItem('danceMVGenerator_img2vid', JSON.stringify(getSettingsData()));
  alert('男生造型設定已儲存！');
};

document.getElementById('exportSettings').onclick = () => {
  const blob = new Blob([JSON.stringify(getSettingsData(), null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'Cute_Boy_MV_ImageToVideo_Settings.json';
  a.click();
  URL.revokeObjectURL(url);
};

document.getElementById('importSettings').onclick = () => document.getElementById('importFile').click();

document.getElementById('importFile').addEventListener('change', function(){
  const file = this.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const raw = JSON.parse(reader.result);
      const data = raw.settings || raw;
      Object.keys(data).forEach(id => {
        const el = document.getElementById(id);
        if(el && id !== 'checks') el.value = data[id];
      });
      makePrompt();
      alert('男生造型設定匯入成功！');
    } catch(e) { alert('格式錯誤。'); }
  };
  reader.readAsText(file);
});

document.getElementById('reset').onclick = () => {
  if(!confirm('確定要重設為初始男生設定嗎？')) return;
  document.querySelectorAll('select').forEach(el => el.selectedIndex = 0);
  document.querySelectorAll('input[type=text], textarea').forEach(el => el.value = '');
  stopAnimation();
  initCanvas();
  makePrompt();
};

/* 啟動 */
initOptions();
initCanvas();
makePrompt();
