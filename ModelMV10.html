<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎀 AI LINE 萌系文字表情貼圖生成器（完整旗艦版）</title>

<!-- APNG 編碼程式庫 -->
<script src="https://cdn.jsdelivr.net/npm/upng-js@2.1.0/UPNG.js"></script>

<style>
:root{
  --pink:#ff6b95;
  --pink2:#ff9eb8;
  --light:#fff0f4;
  --dark:#4a1928;
  --border:#f7c5d3;
  --text:#633342;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
  color:var(--text);
  background:linear-gradient(135deg,#fff6f8,#ffe8ef);
}
header{
  padding:23px 15px;
  text-align:center;
  color:white;
  background:linear-gradient(135deg,#ff6b95,#ffabc2);
  box-shadow:0 4px 15px #e75d8430;
}
header h1{margin:0 0 8px;font-size:25px}
header p{margin:0;font-size:13px;opacity:.95}
.wrap{max-width:1450px;margin:auto;padding:15px}
.app{
  display:grid;
  grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr);
  gap:16px;
  align-items:start;
}
.panel{
  background:white;
  border:1px solid var(--border);
  border-radius:18px;
  padding:17px;
  box-shadow:0 5px 20px #e75d8410;
}
.title{
  font-weight:900;
  color:#d83e6b;
  border-left:5px solid var(--pink);
  padding:7px 10px;
  margin:17px 0 12px;
  background:#fff4f7;
  border-radius:5px;
}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.group{margin-bottom:11px}
label{
  display:block;font-size:12px;font-weight:800;
  margin-bottom:5px;color:#814254;
}
input,select,textarea{
  width:100%;padding:10px;
  border:1px solid #efc5d1;border-radius:10px;
  background:#fffafb;color:#633342;
  font-size:13px;outline:none;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--pink);
  box-shadow:0 0 0 3px #ff6b9520;
}
textarea{resize:vertical;line-height:1.55}
button{
  padding:10px 12px;border:0;border-radius:11px;
  font-weight:800;font-size:13px;cursor:pointer;
  transition:.15s;
}
button:active{transform:scale(.98)}
.primary{
  background:linear-gradient(135deg,var(--pink),var(--pink2));
  color:white;box-shadow:0 4px 12px #ff6b9530;
}
.secondary{background:#ffeef2;color:#c73860}
.success{background:#2b9c69;color:white}
.dark{background:#4a1928;color:white}
.actions{
  display:grid;grid-template-columns:1fr 1fr;
  gap:8px;margin-top:12px;
}
.full{width:100%}
.hint{
  background:#fff7e8;border:1px solid #f5dfb0;
  padding:10px;border-radius:10px;
  font-size:12px;line-height:1.6;color:#80602d;
}
.checkbox-group{
  display:flex;align-items:center;gap:8px;background:#fff4f7;
  padding:10px;border-radius:10px;border:1px solid #efc5d1;
  cursor:pointer;font-weight:800;font-size:13px;color:#d83e6b;
}
.checkbox-group input[type="checkbox"]{
  width:18px;height:18px;accent-color:var(--pink);cursor:pointer;
}
.preview{position:sticky;top:12px}
.tabs{display:flex;gap:7px;margin-bottom:12px}
.tab{
  flex:1;background:#ffeef2;color:#bd4969;
  border:1px solid #f5cada;
}
.tab.active{background:var(--pink);color:white}
.previewbox{
  background:var(--dark);padding:13px;border-radius:16px;
}
.previewbox textarea{
  background:#1a080d;color:#ffdeeb;
  border-color:#71384c;min-height:220px;
}
.canvas-area{
  margin-top:14px;padding:13px;text-align:center;
  background:#fff3f6;border:2px dashed var(--pink2);
  border-radius:17px;
}
.canvas-wrap{
  width:min(100%,320px);margin:10px auto;
  border:1px solid #efc5d1;border-radius:12px;
  overflow:hidden;
  background-color:white;
  background-image:
    linear-gradient(45deg,#eee 25%,transparent 25%),
    linear-gradient(-45deg,#eee 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#eee 75%),
    linear-gradient(-45deg,transparent 75%,#eee 75%);
  background-size:20px 20px;
  background-position:0 0,0 10px,10px -10px,-10px 0;
}
canvas{display:block;width:100%;height:auto}
.status{font-size:12px;color:#9b5368;margin:8px}
.small{font-size:11px;color:#9a6878;line-height:1.5}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .preview{position:static}
}
</style>
</head>

<body>
<header>
  <h1>🎀 AI LINE 萌系文字表情貼圖生成器 🍓</h1>
  <p>完整多樣化選項・性別智慧聯動・單張預覽・一鍵整套 16/24 張批次生成</p>
</header>

<div class="wrap app">

<!-- 左側設定區 -->
<main class="panel">

  <div class="hint">

  <div class="title">① 角色風格設定</div>

  <div class="grid">

        <option>日系熱血動漫少年</option>
        <option>軟萌小動物造型</option>
        <option>傲嬌貓咪系角色</option>
        <option>忠誠狗狗系角色</option>
        <option>精緻 3D 卡通娃娃</option>
        <option>韓系 3D 虛擬偶像</option>
        <option>手作黏土風格</option>
        <option>夢幻水彩插畫風</option>
        <option>療癒系小精靈</option>
      </select>
    </div>
    <div class="group">
      <label>角色性別／設定</label>
      <select id="gender" onchange="handleGenderChange()">
        <option>可愛少女</option>
        <option>可愛少年</option>
        <option>小女孩</option>
        <option>小男孩</option>
        <option>中性角色</option>
        <option>動物角色</option>
        <option>奇幻生物</option>
        <option>不限定性別</option>
      </select>
    </div>
  </div>

  <div class="grid">
    <div class="group">
      <label>髮型／外觀</label>
      <select id="hair"></select>
    </div>
    <div class="group">
      <label>服裝／配件</label>
      <select id="outfit"></select>
    </div>
  </div>

  <div class="group">
    <label>自訂角色細節</label>
    <input id="characterExtra" placeholder="例如：紫色眼睛、星星髮夾、臉頰有愛心">
  </div>

  <div class="title">② 批次整套貼圖生成設定</div>

  <div class="group">
    <label class="checkbox-group">
      <input type="checkbox" id="batchMode" onchange="toggleBatchMode()"> 啟用「整套批次貼圖生成」（保持同一角色風格）
    </label>
  </div>

  <div class="grid" id="batchOptions" style="display:none; margin-bottom:10px;">
    <div class="group">
      <label>整套張數選擇</label>
      <select id="batchCount" onchange="makePrompt()">
        <option value="16">16 張完整表情貼圖組</option>
        <option value="24" selected>24 張完整表情貼圖組（推薦）</option>
      </select>
    </div>
    <div class="group">
      <label>貼圖主題風格</label>
      <select id="batchTheme" onchange="makePrompt()">
        <option value="daily">日常實用聊天對話系列</option>
        <option value="emotion">豐富情緒大爆炸系列</option>
        <option value="cute">撒嬌與萌趣可愛系列</option>
      </select>
    </div>
  </div>

  <div id="singleExpressionArea">
    <div class="title">③ 單張表情與動作設定</div>
    <div class="grid">
      <div class="group">
        <label>表情</label>
        <select id="expression"></select>
      </div>
      <div class="group">
        <label>動作</label>
        <select id="pose"></select>
      </div>
    </div>

    <div class="group">
      <label>貼圖情境／用途</label>
      <select id="scene">
        <option>日常聊天問候</option>
        <option>早安晨安打招呼</option>
        <option>晚安夢鄉祝福</option>
        <option>誠懇感謝與道歉</option>
        <option>撒嬌告白與放閃</option>
        <option>上班打工與疲憊</option>
        <option>好友日常吐槽</option>
        <option>生日派對祝福</option>
        <option>節日歡慶祝賀</option>
        <option>熱血鼓勵與加油</option>
      </select>
    </div>

    <div class="title">④ 貼圖文字與外觀設定</div>

    <div class="group">
      <label>貼圖文字</label>
      <input id="stickerText" value="早安呀！" maxlength="30" placeholder="輸入你想呈現的文字">
    </div>

    <div class="grid">
      <div class="group">
        <label>文字顏色</label>
        <select id="textColor">
          <option value="#ff477e">甜美桃紅</option>
          <option value="#ffffff">純白色</option>
          <option value="#4a1928">深咖啡</option>
          <option value="#ff8c00">活力橘色</option>
          <option value="#7755cc">夢幻紫色</option>
          <option value="#2a9d8f">薄荷綠</option>
          <option value="#2878d0">天空藍</option>
        </select>
      </div>
      <div class="group">
        <label>文字字體風格</label>
        <select id="font">
          <option value="Microsoft JhengHei">圓潤繁體中文字體</option>
          <option value="DFKai-SB">標楷體</option>
          <option value="sans-serif">簡潔黑體</option>
          <option value="serif">優雅明體</option>
        </select>
      </div>
    </div>
  </div>

  <div class="title">⑤ 畫面與輸出設定</div>

  <div class="grid">
    <div class="group">
      <label>貼圖尺寸</label>
      <select id="dimension">
        <option value="370">370 × 370 正方形預覽</option>
        <option value="512" selected>512 × 512 高解析度</option>
      </select>
    </div>
    <div class="group">
      <label>背景</label>
      <select id="background">
        <option value="transparent">透明背景</option>
        <option value="white">純白背景</option>
        <option value="pink">粉嫩背景</option>
      </select>
    </div>
  </div>

  <div class="group">
    <label>上傳自己的角色圖片（選填）</label>
    <input id="uploadImage" type="file" accept="image/png,image/jpeg,image/webp">
  </div>

  <div class="actions">
    <button class="primary" onclick="randomAll()">🎲 隨機靈感</button>
    <button class="secondary" onclick="makePrompt()">✨ 更新指令</button>
  </div>

  <div class="actions">
    <button class="success" onclick="downloadPNG()">🖼️ 匯出靜態 PNG</button>
    <button class="primary" onclick="downloadAPNG()">🎞️ 匯出動態 APNG</button>
  </div>

  <div class="actions">
    <button class="secondary" id="save">💾 儲存設定</button>
    <button class="secondary" onclick="exportSettings()">📤 匯出設定</button>
    <button class="secondary" onclick="document.getElementById('importFile').click()">📥 匯入設定</button>
    <input id="importFile" type="file" accept=".json" hidden>
    <button class="dark" onclick="resetAll()">↺ 重設所有設定</button>
  </div>

</main>

<!-- 右側預覽與指令 -->
<aside class="panel preview">

  <div class="title">⑥ 貼圖即時預覽</div>

  <div class="canvas-area">
    <div class="small">透明背景以棋盤格顯示。</div>
    <div class="canvas-wrap">
      <canvas id="stickerCanvas" width="512" height="512"></canvas>
    </div>
    <div class="status" id="status">已準備好，可以開始製作貼圖！</div>
    <button class="secondary full" onclick="renderSticker()">🔄 重新繪製預覽</button>
  </div>

  <div class="title">⑦ AI 生成指令預覽</div>

  <div class="tabs">
    <button class="tab active" id="tabStatic" onclick="switchTab('static')">🖼️ 靜態 PNG 指令</button>
    <button class="tab" id="tabAnimated" onclick="switchTab('animated')">🎞️ 動態 APNG 指令</button>
  </div>

  <div class="previewbox">
    <textarea id="prompt" spellcheck="false"></textarea>
    <button class="primary full" style="margin-top:9px" onclick="copyPrompt()">
      📋 複製目前生成指令
    </button>
  </div>

</aside>
</div>

    pose: [
      "搖尾巴熱情打招呼", "開心原地蹦蹦跳跳", "趴在地上耍賴裝可愛", "歪頭賣萌疑惑姿勢", 
      "舉起雙爪歡呼萬歲", "抱著最愛食物撒嬌", "慵懶舒服趴睡姿勢", "站立拱手拜託拜託"
    ]
  }
};

function handleGenderChange() {
  const gender = val("gender");
  let type = "girl";
  if (gender.includes("少年") || gender.includes("小男孩")) {
    type = "boy";
  } else if (gender.includes("動物") || gender.includes("奇幻生物")) {
    type = "animal";
  }

  const data = optionsData[type];
  $("hair").innerHTML = data.hair.map(i => `<option>${i}</option>`).join("") + `<option>自訂外觀</option>`;
  $("outfit").innerHTML = data.outfit.map(i => `<option>${i}</option>`).join("") + `<option>自訂服裝</option>`;
  $("expression").innerHTML = data.expression.map(i => `<option>${i}</option>`).join("");
  $("pose").innerHTML = data.pose.map(i => `<option>${i}</option>`).join("");

  renderSticker();
}

function toggleBatchMode() {
  const isBatch = $("batchMode").checked;
  $("batchOptions").style.display = isBatch ? "grid" : "none";
  $("singleExpressionArea").style.display = isBatch ? "none" : "block";
  makePrompt();
}

function val(id){return $(id).value}

function getData(){
  return {
    style:val("style"), gender:val("gender"),
    hair:val("hair"), outfit:val("outfit"),
    characterExtra:val("characterExtra"),
    expression:val("expression"), pose:val("pose"),
    scene:val("scene"), stickerText:val("stickerText"),
    textColor:val("textColor"), font:val("font"),
    dimension:val("dimension"), background:val("background")
  };
}

function makePrompt(){
  const d = getData();
  const isBatch = $("batchMode").checked;
  const count = $("batchCount") ? val("batchCount") : "24";
  const theme = $("batchTheme") ? val("batchTheme") : "daily";

  if(isBatch) {
    const themeName = theme === 'daily' ? '日常實用聊天對話' : (theme === 'emotion' ? '豐富情緒大爆炸' : '撒嬌與萌趣可愛');
    const base=[
      `【AI LINE 萌系表情貼圖整套批次生成指令（共 ${count} 張）】`,
      "",
      `請為我創作一整套包含 ${count} 張、風格與角色高度一致的 LINE 聊天表情貼圖。`,
      `主題風格：${themeName}系列。`,
      "",
      "【核心角色設定（全套統一）】",
      "角色類型："+d.style,
      "角色設定："+d.gender,
      "髮型外觀："+d.hair,
      "服裝配件："+d.outfit,
      "角色補充細節："+(d.characterExtra||"無"),
      "",
      `【批次輸出要求】`,
      `1. 請以網格（Grid）或連環圖形式，一次規劃並呈現完整的 ${count} 張不同表情與動作的貼圖。`,
      "2. 保持同一位主角的外貌、髮型、服飾與美術風格 100% 完全一致。",
      `3. 每張貼圖搭配不同的表情與對應的短文字（如：早安、收到、謝謝、OK、辛苦了等）。`,
      "4. 所有文字必須清晰易讀、字體風格一致，且為正確繁體中文。",
      "5. 正方形構圖、主體置中、去背透明背景（Transparent background）、無多餘浮水印。"
    ];
    $("prompt").value = base.join("\n");
    return;
  }

  // 單張生成指令
  const base=[
    "【AI LINE 萌系文字表情貼圖生成指令】",
    "",
    "請創作一張高品質、可愛、具有辨識度的 LINE 聊天表情貼圖。",
    "",
    "【角色設定】",
    "角色類型："+d.style,
    "角色設定："+d.gender,
    "髮型外觀："+d.hair,
    "服裝配件："+d.outfit,
    "角色補充："+(d.characterExtra||"無"),
    "",
    "【表情與動作】",
    "表情："+d.expression+"（"+(expressionsMap[d.expression]||"可愛表情")+"）",
    "動作："+d.pose,
    "情境："+d.scene,
    "",
    "【貼圖文字】",
    "主要文字："+(d.stickerText||"無"),
    "文字顏色："+d.textColor,
    "字體風格："+d.font,
    "必須正確呈現繁體中文，不可錯字、漏字、亂碼。"
  ];

  if(currentTab==="animated"){
    base.push("", "【動態 APNG 動畫指令】", "動畫效果：上下彈跳", "輸出多影格動畫素材，供 APNG 編碼使用。");
  } else {
    base.push("", "【靜態 PNG 指令】", "輸出單張高解析度透明背景 PNG。");
  }

  $("prompt").value = base.join("\n");
}

function switchTab(tab){
  currentTab=tab;
  $("tabStatic").classList.toggle("active",tab==="static");
  $("tabAnimated").classList.toggle("active",tab==="animated");
  makePrompt();
}

async function copyPrompt(){
  try{
    await navigator.clipboard.writeText($("prompt").value);
    $("status").textContent="✓ 已複製生成指令！";
  }catch(e){
    $("prompt").select();
    document.execCommand("copy");
    $("status").textContent="已嘗試複製指令。";
  }
}

// 儲存與匯出匯入功能
function saveSettings(){
  localStorage.setItem("aiLineStickerSettings", JSON.stringify(getData()));
  $("status").textContent="✓ 設定已儲存於本機瀏覽器。";
}

function exportSettings(){
  const blob=new Blob([JSON.stringify(getData(), null, 2)], {type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download="LINE_Sticker_Settings.json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}

function importSettings(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      Object.keys(data).forEach(id=>{
        if($(id)) $(id).value = data[id];
      });
      renderSticker();
      alert("設定匯入成功！");
    }catch(e){alert("設定檔格式錯誤。");}
  };
  reader.readAsText(file);
}

function resetAll(){
  if(!confirm("確定要重設所有設定嗎？"))return;
  $("gender").selectedIndex=0;
  $("batchMode").checked=false;
  toggleBatchMode();
  handleGenderChange();
  renderSticker();
}

$("save").addEventListener("click", saveSettings);
$("importFile").addEventListener("change", e => {
  if(e.target.files[0]) importSettings(e.target.files[0]);
});

function drawFrame(){
  ctx.clearRect(0,0,512,512);
  const bg = val("background");
  if(bg !== "transparent") {
    ctx.fillStyle = bg === "white" ? "#ffffff" : "#ffe0eb";
    ctx.fillRect(0,0,512,512);
  }
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.font="220px serif";
  const gender = val("gender");
  let emoji = "👧";
  if(gender.includes("少年") || gender.includes("小男孩")) emoji = "👦";
  else if(gender.includes("動物")) emoji = "🐶";
  ctx.fillText(emoji, 256, 256);
}

function renderSticker(){
  const size = Number(val("dimension"));
  canvas.width = size; canvas.height = size;
  ctx.setTransform(size/512, 0, 0, size/512, 0, 0);
  drawFrame();
  makePrompt();
}

function downloadPNG(){
  renderSticker();
  canvas.toBlob(blob=>{
    if(!blob)return;
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download="LINE_Sticker_Static.png"; a.click();
    setTimeout(()=>URL.revokeObjectURL(url), 1500);
  },"image/png");
}

async function downloadAPNG(){
  if(!window.UPNG){alert("APNG 編碼程式庫尚未載入。");return;}
  try{
    const size = Number(val("dimension"));
    const frames=[], delays=[];
    for(let i=0; i<12; i++){
      drawFrame();
      frames.push(ctx.getImageData(0,0,size,size).data.buffer);
      delays.push(180);
    }
    const apng = UPNG.encode(frames, size, size, 0, delays);
    const url = URL.createObjectURL(new Blob([apng], {type:"image/png"}));
    const a = document.createElement("a");
    a.href = url; a.download = "LINE_Sticker_Animated.png"; a.click();
    setTimeout(()=>URL.revokeObjectURL(url), 1500);
  }catch(e){alert("APNG 匯出失敗");}
}

function randomAll(){
  const genderKey = val("gender").includes("少年") || val("gender").includes("小男孩") ? "boy" : (val("gender").includes("動物") ? "animal" : "girl");
  const hairOpts = optionsData[genderKey].hair;
  const outfitOpts = optionsData[genderKey].outfit;
  const exprOpts = optionsData[genderKey].expression;
  
  $("hair").value = hairOpts[Math.floor(Math.random()*hairOpts.length)];
  $("outfit").value = outfitOpts[Math.floor(Math.random()*outfitOpts.length)];
  $("expression").value = exprOpts[Math.floor(Math.random()*exprOpts.length)];
  renderSticker();
}

document.querySelectorAll("input,select,textarea").forEach(el=>{
  if(el.id !== "gender") el.addEventListener("input", renderSticker);
});

$("uploadImage").addEventListener("change", e => {
  const file = e.target.files[0];
  if(!file)return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => { uploadedImage=img; uploadedReady=true; renderSticker(); };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
});

handleGenderChange();
renderSticker();
</script>
