<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎀 AI LINE 萌系文字表情貼圖生成器</title>
<script src="https://cdn.jsdelivr.net/npm/upng-js@2.1.0/UPNG.js"></script>
<style>
:root{
  --pink:#ff6b95;
  --pink2:#ff9eb8;
  --light:#fff0f4;
  --dark:#4a1928;
  --border:#f7c5d3;
  --text:#633342;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
  color:var(--text);
  background:linear-gradient(135deg,#fff6f8,#ffe8ef);
}
header{
  padding:20px 15px;
  text-align:center;
  color:white;
  background:linear-gradient(135deg,#ff6b95,#ffabc2);
  box-shadow:0 4px 15px #e75d8430;
}
header h1{margin:0 0 6px;font-size:24px}
header p{margin:0;font-size:13px;opacity:.95}
.badge-bar{
  display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:10px;
}
.badge{
  background:rgba(255,255,255,0.25);padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;
}
.wrap{max-width:1450px;margin:auto;padding:15px}
.app{
  display:grid;
  grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);
  gap:16px;
  align-items:start;
}
.panel{
  background:white;
  border:1px solid var(--border);
  border-radius:18px;
  padding:17px;
  box-shadow:0 5px 20px #e75d8410;
}
.title{
  font-weight:900;
  color:#d83e6b;
  border-left:5px solid var(--pink);
  padding:7px 10px;
  margin:17px 0 12px;
  background:#fff4f7;
  border-radius:5px;
  display:flex;justify-content:space-between;align-items:center;
}
.title span.count-tag{
  font-size:11px;background:#ff6b95;color:white;padding:2px 8px;border-radius:10px;
}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.group{margin-bottom:11px}
label{
  display:block;font-size:12px;font-weight:800;
  margin-bottom:5px;color:#814254;
}
input,select,textarea{
  width:100%;padding:9px 10px;
  border:1px solid #efc5d1;border-radius:10px;
  background:#fffafb;color:#633342;
  font-size:13px;outline:none;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--pink);
  box-shadow:0 0 0 3px #ff6b9520;
}
.search-box{
  position:relative;margin-bottom:6px;
}
.search-box input{
  background:#fff0f4;border:1px dashed #ff6b95;padding-left:30px;font-size:12px;
}
.search-box::before{
  content:"🔍";position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:12px;
}
textarea{resize:vertical;line-height:1.55}
button{
  padding:10px 12px;border:0;border-radius:11px;
  font-weight:800;font-size:13px;cursor:pointer;
  transition:.15s;
}
button:active{transform:scale(.98)}
.primary{
  background:linear-gradient(135deg,var(--pink),var(--pink2));
  color:white;box-shadow:0 4px 12px #ff6b9530;
}
.secondary{background:#ffeef2;color:#c73860}
.success{background:#2b9c69;color:white}
.dark{background:#4a1928;color:white}
.actions{
  display:grid;grid-template-columns:1fr 1fr;
  gap:8px;margin-top:12px;
}
.full{width:100%}
.hint{
  background:#fff7e8;border:1px solid #f5dfb0;
  padding:10px;border-radius:10px;
  font-size:12px;line-height:1.6;color:#80602d;
}
.checkbox-group{
  display:flex;align-items:center;gap:8px;background:#fff4f7;
  padding:10px;border-radius:10px;border:1px solid #efc5d1;
  cursor:pointer;font-weight:800;font-size:13px;color:#d83e6b;
}
.checkbox-group input[type="checkbox"]{
  width:18px;height:18px;accent-color:var(--pink);cursor:pointer;
}
.preview{position:sticky;top:12px}
.tabs{display:flex;gap:7px;margin-bottom:12px}
.tab{
  flex:1;background:#ffeef2;color:#bd4969;
  border:1px solid #f5cada;
}
.tab.active{background:var(--pink);color:white}
.previewbox{
  background:var(--dark);padding:13px;border-radius:16px;
}
.previewbox textarea{
  background:#1a080d;color:#ffdeeb;
  border-color:#71384c;min-height:260px;
}
.canvas-area{
  margin-top:14px;padding:13px;text-align:center;
  background:#fff3f6;border:2px dashed var(--pink2);
  border-radius:17px;
}
.canvas-wrap{
  width:min(100%,300px);margin:10px auto;
  border:1px solid #efc5d1;border-radius:12px;
  overflow:hidden;
  background-color:white;
  background-image:
    linear-gradient(45deg,#eee 25%,transparent 25%),
    linear-gradient(-45deg,#eee 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#eee 75%),
    linear-gradient(-45deg,transparent 75%,#eee 75%);
  background-size:20px 20px;
  background-position:0 0,0 10px,10px -10px,-10px 0;
}
canvas{display:block;width:100%;height:auto}
.status{font-size:12px;color:#9b5368;margin:8px}
.small{font-size:11px;color:#9a6878;line-height:1.5}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .preview{position:static}
}
</style>
</head>

<body>
<header>
  <h1>🎀 AI LINE 萌系文字表情貼圖生成器 🍓</h1>
  <p>全能版</p>
  <div class="badge-bar" id="statsBar"></div>
</header>

<div class="wrap app">

<main class="panel">

  <div class="hint">
    💡 <b>升級說明：</b>已將「女裝」與「男裝」各自擴充至 <b>300+ 套獨立服裝</b>（切換角色性別自動切換對應性別 300+ 套服裝），並新增<b>服裝關鍵字即時搜尋框</b>！同時保留 350+ 生活動作與右側即時 AI 指令同步顯示。
  </div>

  <div class="title">① 角色風格、髮型與 300+ 服裝庫 <span class="count-tag" id="charCountTag"></span></div>

  <div class="grid">
    <div class="group">
      <label>角色類型</label>
      <select id="style">
        <option>Q版萌系美少女</option>
        <option>Q版萌系美少年</option>
        <option>日系二次元動漫美少女</option>
        <option>日系熱血動漫少年</option>
        <option>軟萌小動物造型</option>
        <option>傲嬌貓咪系角色</option>
        <option>忠誠狗狗系角色</option>
        <option>精緻 3D 卡通娃娃</option>
        <option>韓系 3D 虛擬偶像</option>
        <option>手作黏土風格</option>
        <option>夢幻水彩插畫風</option>
        <option>療癒系小精靈</option>
        <option>美式復古卡通風</option>
        <option>韓系可愛插畫扁平風</option>
      </select>
    </div>
    <div class="group">
      <label>角色性別／設定（切換自動載入對應 300+ 服裝）</label>
      <select id="gender" onchange="handleGenderChange()">
        <option>可愛少女</option>
        <option>可愛少年</option>
        <option>小女孩</option>
        <option>小男孩</option>
        <option>中性角色</option>
        <option>動物角色</option>
        <option>奇幻生物</option>
      </select>
    </div>
  </div>

  <div class="group">
    <label>髮型／外觀（35+種）</label>
    <select id="hair"></select>
  </div>

  <div class="group">
    <label id="outfitLabel">服裝／配件（300+ 套獨立款式，支援關鍵字搜尋）</label>
    <div class="search-box">
      <input id="outfitSearch" placeholder="輸入關鍵字篩選服裝：例如 洋裝、西裝、睡衣、制服、漢服、和服、運動、禮服、皮衣..." oninput="filterOutfits()">
    </div>
    <select id="outfit" size="5" style="height:130px;"></select>
  </div>

  <div class="group">
    <label>自訂角色細節</label>
    <input id="characterExtra" placeholder="例如：紫色眼睛、星星髮夾、臉頰有愛心、戴黑框眼鏡">
  </div>

  <div class="title">② 批次整套貼圖生成設定</div>

  <div class="group">
    <label class="checkbox-group">
      <input type="checkbox" id="batchMode" onchange="toggleBatchMode()"> 啟用「整套批次貼圖生成」（保持同一角色風格）
    </label>
  </div>

  <div class="grid" id="batchOptions" style="display:none; margin-bottom:10px;">
    <div class="group">
      <label>整套張數選擇</label>
      <select id="batchCount" onchange="makePrompt()">
        <option value="16">16 張完整表情貼圖組</option>
        <option value="24" selected>24 張完整表情貼圖組（推薦）</option>
        <option value="32">32 張超豐富貼圖組</option>
        <option value="40">40 張 LINE 官方最大規格全套組</option>
      </select>
    </div>
    <div class="group">
      <label>貼圖主題風格</label>
      <select id="batchTheme" onchange="makePrompt()">
        <option value="daily">日常實用聊天對話系列</option>
        <option value="emotion">豐富情緒大爆炸系列</option>
        <option value="cute">撒嬌與萌趣可愛系列</option>
        <option value="dramatic">生活百態戲劇化系列（化妝、翻桌、騎車、喝酒、跳舞）</option>
        <option value="work">社畜職場求生與下班狂歡系列</option>
      </select>
    </div>
  </div>

  <div id="singleExpressionArea">
    <div class="title">③ 表情、350+ 獨立動作與場景 <span class="count-tag" id="poseCountTag"></span></div>
    
    <div class="group">
      <label>表情（42種細膩情緒）</label>
      <select id="expression"></select>
    </div>

    <div class="group">
      <label>生活動作庫（可輸入關鍵字快速過濾 350+ 種動作）</label>
      <div class="search-box">
        <input id="poseSearch" placeholder="輸入關鍵字篩選動作：例如 化妝、口紅、翻桌、機車、喝酒、跳舞、手機、吃..." oninput="filterPoses()">
      </div>
      <select id="pose" size="5" style="height:130px;"></select>
    </div>

    <div class="group">
      <label>貼圖情境／背景場景（50種生活場景）</label>
      <select id="scene"></select>
    </div>

    <div class="title">④ 150+ 貼圖文字與外觀設定 <span class="count-tag" id="textCountTag"></span></div>

    <div class="group">
      <label>快速選擇常用貼圖文字（150種分類）</label>
      <select id="presetTextSelect" onchange="selectPresetText(this)"></select>
    </div>

    <div class="group">
      <label>貼圖文字（可自由輸入或修改）</label>
      <input id="stickerText" value="早安" maxlength="30" placeholder="輸入你想呈現的文字">
    </div>

    <div class="grid">
      <div class="group">
        <label>文字顏色（24 種）</label>
        <select id="textColor">
          <option value="#ff477e">甜美桃紅</option>
          <option value="#ff2a6d">放閃熱戀紅</option>
          <option value="#ff6b95">萌系粉紅</option>
          <option value="#ff8c00">活力橘色</option>
          <option value="#ffd700">亮眼金黃</option>
          <option value="#38b000">清新草綠</option>
          <option value="#2a9d8f">薄荷綠</option>
          <option value="#00b4d8">海洋蔚藍</option>
          <option value="#2878d0">天空藍</option>
          <option value="#7755cc">夢幻紫色</option>
          <option value="#9b5de5">電音紫粉</option>
          <option value="#f72585">潮流桃紫</option>
          <option value="#ffffff">純白色</option>
          <option value="#f8f9fa">米白色</option>
          <option value="#ced4da">銀灰色</option>
          <option value="#6c757d">沉穩灰</option>
          <option value="#343a40">炭黑色</option>
          <option value="#4a1928">深咖啡色</option>
          <option value="#d4a373">焦糖奶茶色</option>
          <option value="#bc6c25">復古琥珀棕</option>
          <option value="#e63946">鮮紅警示</option>
          <option value="#fb8500">夕陽橘黃</option>
          <option value="#4cc9f0">霓虹淺藍</option>
          <option value="#7209b7">神祕深紫</option>
        </select>
      </div>
      <div class="group">
        <label>文字字體風格</label>
        <select id="font">
          <option value="Microsoft JhengHei">圓潤繁體中文字體</option>
          <option value="DFKai-SB">標楷體</option>
          <option value="sans-serif">簡潔黑體</option>
          <option value="serif">優雅明體</option>
        </select>
      </div>
    </div>
  </div>

  <div class="title">⑤ 畫面與輸出設定</div>

  <div class="grid">
    <div class="group">
      <label>貼圖尺寸</label>
      <select id="dimension">
        <option value="370">370 × 370 正方形預覽</option>
        <option value="512" selected>512 × 512 高解析度</option>
      </select>
    </div>
    <div class="group">
      <label>背景顏色（10 種）</label>
      <select id="background" onchange="renderSticker()">
        <option value="transparent">透明去背背景（LINE貼圖推薦）</option>
        <option value="white">純白乾淨背景</option>
        <option value="pink">粉嫩櫻花背景</option>
        <option value="blue">清新天空藍背景</option>
        <option value="yellow">溫暖奶油黃背景</option>
        <option value="mint">療癒薄荷綠背景</option>
        <option value="purple">夢幻薰衣草紫背景</option>
        <option value="orange">活力蜜桃橘背景</option>
        <option value="dark">質感星空深藍背景</option>
        <option value="gradient">粉藍夢幻漸層背景</option>
      </select>
    </div>
  </div>

  <div class="group">
    <label>上傳自己的角色圖片（選填）</label>
    <input id="uploadImage" type="file" accept="image/png,image/jpeg,image/webp">
  </div>

  <div class="actions">
    <button class="primary" onclick="randomAll()">🎲 隨機靈感</button>
    <button class="secondary" onclick="makePrompt()">✨ 更新指令</button>
  </div>

  <div class="actions">
    <button class="success" onclick="downloadPNG()">🖼️ 匯出靜態 PNG</button>
    <button class="primary" onclick="downloadAPNG()">🎞️ 匯出動態 APNG</button>
  </div>

  <div class="actions">
    <button class="secondary" id="save">💾 儲存設定</button>
    <button class="secondary" onclick="exportSettings()">📤 匯出設定</button>
    <button class="secondary" onclick="document.getElementById('importFile').click()">📥 匯入設定</button>
    <input id="importFile" type="file" accept=".json" hidden>
    <button class="dark" onclick="resetAll()">↺ 重設所有設定</button>
  </div>

</main>

<aside class="panel preview">

  <div class="title">⑥ 貼圖即時預覽</div>

  <div class="canvas-area">
    <div class="small">透明背景以棋盤格顯示。</div>
    <div class="canvas-wrap">
      <canvas id="stickerCanvas" width="512" height="512"></canvas>
    </div>
    <div class="status" id="status">已準備好，可以開始製作貼圖！</div>
    <button class="secondary full" onclick="renderSticker()">🔄 重新繪製預覽</button>
  </div>

  <div class="title">⑦ AI 生成指令預覽</div>

  <div class="tabs">
    <button class="tab active" id="tabStatic" onclick="switchTab('static')">🖼️ 靜態 PNG 指令</button>
    <button class="tab" id="tabAnimated" onclick="switchTab('animated')">🎞️ 動態 APNG 指令</button>
  </div>

  <div class="previewbox">
    <textarea id="prompt" spellcheck="false"></textarea>
    <button class="primary full" style="margin-top:9px" onclick="copyPrompt()">
      📋 複製目前生成指令
    </button>
  </div>

</aside>
</div>

<script>

const canvas = $("stickerCanvas");

      "專屬小吊帶褲裝", "繽紛可愛小背心", "純天然裸裝萌態", "迷你小西裝打領帶", "可愛小雨衣造型"

function initStaticDropdowns() {
  $("expression").innerHTML = Object.keys(expressionsMap).map(k => `<option value="${k}">${k}</option>`).join("");
  $("scene").innerHTML = scenesList.map(s => `<option value="${s}">${s}</option>`).join("");

  let textHtml = `<option value="">-- 請選擇內建常用文字快速帶入（共 150 種） --</option>`;
  let totalTexts = 0;
  for (const [groupLabel, items] of Object.entries(presetTextsGrouped)) {
    textHtml += `<optgroup label="${groupLabel}">`;
    items.forEach(txt => {
      textHtml += `<option value="${txt}">${txt}</option>`;
      totalTexts++;
    });
    textHtml += `</optgroup>`;
  }
  $("presetTextSelect").innerHTML = textHtml;
  $("textCountTag").textContent = `${totalTexts} 種文字`;

  $("statsBar").innerHTML = `
    <span class="badge">👗 女裝：${optionsData.girl.outfit.length} 套</span>
    <span class="badge">👔 男裝：${optionsData.boy.outfit.length} 套</span>
    <span class="badge">🔥 獨立動作：${masterPosesList.length} 種</span>
    <span class="badge">💬 貼圖文字：${totalTexts} 種</span>
  `;
}

function renderOutfitOptions(list) {
  $("outfit").innerHTML = list.map((o, idx) => `<option value="${o}">${idx + 1}. ${o}</option>`).join("") + `<option value="自訂服裝">自訂服裝</option>`;
  if (list.length > 0) {
    $("outfit").selectedIndex = 0;
  }
  $("charCountTag").textContent = `目前顯示 ${list.length} / ${currentOutfitList.length} 套服裝`;
}

function filterOutfits() {
  const kw = $("outfitSearch").value.trim().toLowerCase();
  if (!kw) {
    renderOutfitOptions(currentOutfitList);
  } else {
    const filtered = currentOutfitList.filter(o => o.toLowerCase().includes(kw));
    renderOutfitOptions(filtered);
  }
  renderSticker();
}

function renderPoseOptions(list) {
  $("pose").innerHTML = list.map((p, idx) => `<option value="${p}">${idx + 1}. ${p}</option>`).join("");
  if (list.length > 0) {
    $("pose").selectedIndex = 0;
  }
  $("poseCountTag").textContent = `目前顯示 ${list.length} / ${masterPosesList.length} 種動作`;
}

function filterPoses() {
  const kw = $("poseSearch").value.trim().toLowerCase();
  if (!kw) {
    renderPoseOptions(masterPosesList);
  } else {
    const filtered = masterPosesList.filter(p => p.toLowerCase().includes(kw));
    renderPoseOptions(filtered);
  }
  renderSticker();
}

function selectPresetText(selectObj) {
  if (selectObj.value) {
    $("stickerText").value = selectObj.value;
    renderSticker();
  }
}

function handleGenderChange() {
  const gender = val("gender");
  let type = "girl";
  let labelPrefix = "女裝／通用服裝庫";
  if (gender.includes("少年") || gender.includes("小男孩")) {
    type = "boy";
    labelPrefix = "男裝／通用服裝庫";
  } else if (gender.includes("動物") || gender.includes("奇幻生物")) {
    type = "animal";
    labelPrefix = "萌寵／奇幻服裝庫";
  }

  const data = optionsData[type];
  $("hair").innerHTML = data.hair.map(i => `<option>${i}</option>`).join("") + `<option>自訂外觀</option>`;
  currentOutfitList = data.outfit;
  $("outfitSearch").value = "";
  $("outfitLabel").textContent = `${labelPrefix}（共 ${currentOutfitList.length} 套獨立款式，支援關鍵字搜尋）`;
  renderOutfitOptions(currentOutfitList);

  renderPoseOptions(masterPosesList);
  renderSticker();
}

function toggleBatchMode() {
  const isBatch = $("batchMode").checked;
  $("batchOptions").style.display = isBatch ? "grid" : "none";
  $("singleExpressionArea").style.display = isBatch ? "none" : "block";
  makePrompt();
}

function val(id){return $(id) ? $(id).value : ""}

function getData(){
  return {
    style:val("style"), gender:val("gender"),
    hair:val("hair"), outfit:val("outfit") || currentOutfitList[0],
    characterExtra:val("characterExtra"),
    expression:val("expression"), pose:val("pose") || masterPosesList[0],
    scene:val("scene"), stickerText:val("stickerText"),
    textColor:val("textColor"), font:val("font"),
    dimension:val("dimension"), background:val("background")
  };
}

function makePrompt(){
  const d = getData();
  const isBatch = $("batchMode").checked;

  const theme = $("batchTheme") ? val("batchTheme") : "daily";

    const themeMap = {
      daily: '日常實用聊天對話',

      "",
      "【核心角色設定（全套統一）】",
      "角色類型："+d.style,
      "角色設定："+d.gender,
      "髮型外觀："+d.hair,
      "服裝配件："+d.outfit,
      "角色補充細節："+(d.characterExtra||"無"),
      "",
      `【批次輸出與畫面要求】`,
      `1. 請以網格（Grid）或連環圖形式，一次規劃並呈現完整的 ${count} 張不同表情與生活動作的貼圖。`,
      "2. 動作需生動誇張有戲劇張力（包含生活細節道具如化妝鏡、口紅、機車安全帽、啤酒杯、翻桌特效等）。",
      "3. 保持同一位主角的外貌、髮型、服飾與美術風格 100% 完全一致。",
      "4. 每張貼圖搭配對應的繁體中文短文字（如：早安、完妝出門、翻桌啦、騎車中、乾杯、嗨起來等）。",
      "5. 所有文字必須清晰易讀、字體風格一致，且為正確繁體中文。",
      "6. 畫面尺寸比例："+d.dimension+"×"+d.dimension+" 正方形構圖、主體置中、外圍加上乾淨白色貼紙描邊。",
      "7. 背景設定："+bgInfo.prompt+"，無多餘浮水印。"

  const base=[

    "角色設定："+d.gender,
    "髮型外觀："+d.hair,
    "服裝配件："+d.outfit,
    "角色補充："+(d.characterExtra||"無"),
    "",
    "【表情、具體動作與情境】",
    "表情："+d.expression+"（"+(expressionsMap[d.expression]||"生動表情")+"）",
    "具體動作："+d.pose,
    "情境場景："+d.scene,
    "",
    "【貼圖文字】",
    "主要文字："+(d.stickerText||"無"),
    "文字顏色代碼："+d.textColor,
    "字體風格："+d.font,
    "必須正確呈現繁體中文，不可錯字、漏字、亂碼，文字建議加上白色粗外框使其更醒目。",
    "",
    "【畫面與背景設定】",
    "畫面尺寸："+d.dimension+" × "+d.dimension+" 像素（1:1 正方形構圖，角色與道具完整呈現且置中）",

  ];

    base.push("", "【動態 APNG 動畫指令】", `動畫效果：針對「${d.pose}」設計流暢循環的微動畫（如手部動作、表情變化、特效閃爍或輕快律動）。`, "輸出多影格連續動畫素材，供 APNG 編碼使用。");

function switchTab(tab){
  currentTab=tab;
  $("tabStatic").classList.toggle("active",tab==="static");
  $("tabAnimated").classList.toggle("active",tab==="animated");
  makePrompt();
}

async function copyPrompt(){
  try{
    await navigator.clipboard.writeText($("prompt").value);
    $("status").textContent="✓ 已複製生成指令！";
  }catch(e){
    $("prompt").select();
    document.execCommand("copy");
    $("status").textContent="已嘗試複製指令。";
  }
}

function saveSettings(){
  localStorage.setItem("aiLineStickerSettings300Outfits", JSON.stringify(getData()));
  $("status").textContent="✓ 設定已儲存於本機瀏覽器。";
}

function exportSettings(){
  const blob=new Blob([JSON.stringify(getData(), null, 2)], {type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download="LINE_Sticker_Settings_Full300.json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}

function importSettings(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      Object.keys(data).forEach(id=>{
        if($(id)) $(id).value = data[id];
      });
      renderSticker();
      alert("設定匯入成功！");
    }catch(e){alert("設定檔格式錯誤。");}
  };
  reader.readAsText(file);
}

function resetAll(){
  if(!confirm("確定要重設所有設定嗎？"))return;
  $("gender").selectedIndex=0;
  $("background").selectedIndex=0;
  $("poseSearch").value="";
  $("outfitSearch").value="";
  $("batchMode").checked=false;
  toggleBatchMode();
  handleGenderChange();
  renderSticker();
}

$("save").addEventListener("click", saveSettings);
$("importFile").addEventListener("change", e => {
  if(e.target.files[0]) importSettings(e.target.files[0]);
});

function drawFrame(offsetY = 0){
  ctx.clearRect(0,0,512,512);
  const bg = val("background");
  const bgInfo = backgroundMap[bg] || backgroundMap.transparent;

  if(bgInfo.color === "gradient") {
    const grad = ctx.createLinearGradient(0, 0, 512, 512);
    grad.addColorStop(0, "#ffd6e7");
    grad.addColorStop(1, "#d6f0ff");
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,512,512);
  } else if(bgInfo.color) {
    ctx.fillStyle = bgInfo.color;
    ctx.fillRect(0,0,512,512);
  }

  if(uploadedReady && uploadedImage){
    const scale = Math.min(300 / uploadedImage.width, 300 / uploadedImage.height);
    const w = uploadedImage.width * scale;
    const h = uploadedImage.height * scale;
    ctx.drawImage(uploadedImage, (512 - w)/2, 60 + offsetY, w, h);
  } else {
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.font="180px serif";
    const poseTxt = val("pose");
    let emoji = "👧";
    if(poseTxt.includes("口紅") || poseTxt.includes("化妝")) emoji = "💄";
    else if(poseTxt.includes("翻桌") || poseTxt.includes("怒") || poseTxt.includes("氣")) emoji = "💢";
    else if(poseTxt.includes("機車") || poseTxt.includes("安全帽")) emoji = "🛵";
    else if(poseTxt.includes("酒") || poseTxt.includes("乾杯")) emoji = "🍻";
    else if(poseTxt.includes("舞") || poseTxt.includes("歌")) emoji = "💃";
    else if(val("gender").includes("少年") || val("gender").includes("小男孩")) emoji = "👦";
    else if(val("gender").includes("動物")) emoji = "🐶";
    ctx.fillText(emoji, 256, 200 + offsetY);
  }

  const text = val("stickerText");
  if(text){
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const fontSize = text.length > 6 ? 44 : 60;
    ctx.font = `900 ${fontSize}px "${val("font")}", sans-serif`;
    ctx.lineJoin = "round";
    ctx.lineWidth = 12;
    ctx.strokeStyle = "#ffffff";
    ctx.strokeText(text, 256, 430 + offsetY * 0.5);
    ctx.fillStyle = val("textColor");
    ctx.fillText(text, 256, 430 + offsetY * 0.5);
    ctx.restore();
  }
}

function renderSticker(){
  const size = Number(val("dimension"));
  canvas.width = size; canvas.height = size;
  ctx.setTransform(size/512, 0, 0, size/512, 0, 0);
  drawFrame(0);
  makePrompt();
}

function downloadPNG(){
  renderSticker();
  canvas.toBlob(blob=>{
    if(!blob)return;
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download="LINE_Sticker_Static.png"; a.click();
    setTimeout(()=>URL.revokeObjectURL(url), 1500);
  },"image/png");
}

async function downloadAPNG(){
  if(!window.UPNG){alert("APNG 編碼程式庫尚未載入。");return;}
  try{
    const size = Number(val("dimension"));
    const frames=[], delays=[];
    for(let i=0; i<12; i++){
      const bounce = Math.sin((i / 12) * Math.PI * 2) * 12;
      ctx.setTransform(size/512, 0, 0, size/512, 0, 0);
      drawFrame(bounce);
      frames.push(ctx.getImageData(0,0,size,size).data.buffer);
      delays.push(120);
    }
    const apng = UPNG.encode(frames, size, size, 0, delays);
    const url = URL.createObjectURL(new Blob([apng], {type:"image/png"}));
    const a = document.createElement("a");
    a.href = url; a.download = "LINE_Sticker_Animated.png"; a.click();
    setTimeout(()=>URL.revokeObjectURL(url), 1500);
    renderSticker();
  }catch(e){alert("APNG 匯出失敗");}
}

function randomAll(){
  $("poseSearch").value = "";
  $("outfitSearch").value = "";
  renderPoseOptions(masterPosesList);
  renderOutfitOptions(currentOutfitList);

  const genderKey = val("gender").includes("少年") || val("gender").includes("小男孩") ? "boy" : (val("gender").includes("動物") ? "animal" : "girl");
  const hairOpts = optionsData[genderKey].hair;
  const exprOpts = Object.keys(expressionsMap);
  
  $("hair").value = hairOpts[Math.floor(Math.random()*hairOpts.length)];
  $("outfit").selectedIndex = Math.floor(Math.random()*currentOutfitList.length);
  $("expression").value = exprOpts[Math.floor(Math.random()*exprOpts.length)];
  $("pose").selectedIndex = Math.floor(Math.random()*masterPosesList.length);
  $("scene").selectedIndex = Math.floor(Math.random()*scenesList.length);
  
  const allTexts = Object.values(presetTextsGrouped).flat();
  $("stickerText").value = allTexts[Math.floor(Math.random()*allTexts.length)];

  const bgOptions = [...$("background").options];
  $("background").value = bgOptions[Math.floor(Math.random()*bgOptions.length)].value;
  renderSticker();
}

document.querySelectorAll("input,select,textarea").forEach(el=>{
  if(el.id !== "gender" && el.id !== "prompt" && el.id !== "poseSearch" && el.id !== "outfitSearch") {
    el.addEventListener("input", renderSticker);
    el.addEventListener("change", renderSticker);
  }
});

$("uploadImage").addEventListener("change", e => {
  const file = e.target.files[0];
  if(!file)return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => { uploadedImage=img; uploadedReady=true; renderSticker(); };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
});

initStaticDropdowns();
handleGenderChange();
renderSticker();
</script>
