<head>
<meta charset="UTF-8">

<style>
:root{
  --pink:#16d9e8;
  --pink2:#8c7bff;
  --bg:#071321;
  --line:#214b68;
  --ink:#d9f6ff;
  --dark:#030914;
  --accent:#32e6ff;
}
*{box-sizing:border-box}

body{
  margin:0;
  font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;
  background:radial-gradient(ellipse at top,#12304b 0%,#071321 58%,#030914 100%);
  color:var(--ink);
}

header{
  background:linear-gradient(120deg,#075b83,#493b9b 58%,#087e91);
  color:white;
  padding:24px 20px;
  text-align:center;
  box-shadow:0 8px 30px #00d9ff25;
}

.wrap{
  max-width:1300px;
  margin:auto;
}

h1{
  margin:0;
  font-size:26px;
}

header p{
  margin:8px 0 0;
  opacity:.95;
  font-size:14px;
}

.app{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px;
  padding:24px 20px 42px;
}

.panel{
  background:linear-gradient(145deg,#0d2033,#101a31);
  border:2px solid #24516c;
  border-radius:24px;
  padding:22px;
  box-shadow:0 12px 34px #00cfff12;
}

.title{
  font-size:18px;
  font-weight:800;
  margin:12px 0 16px;
  padding-bottom:8px;
  border-bottom:2px dashed #24516c;
  color:#5ceaff;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.group{
  margin-bottom:16px;
}

label{
  display:block;
  font-weight:800;
  margin-bottom:6px;
  font-size:13px;
  color:#c9f3ff;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

select,
input[type=text],
textarea{
  width:100%;
  border:1px solid #28536c;
  border-radius:14px;
  padding:10px 12px;
  background:#071727;
  font:inherit;
  color:#d9f6ff;
  font-size:13px;
}

textarea{
  resize:vertical;
}

.checks{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.check{
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 12px;
  background:#10283b;
  border:1px solid #28536c;
  border-radius:999px;
  font-size:12px;
  color:#d9f6ff;
}

.check input{
  accent-color:var(--pink);
}

.preview{
  position:sticky;
  top:16px;
}

.tab-btn-group{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}

.tab-btn{
  flex:1;
  padding:10px;
  border-radius:12px;
  border:2px solid #34728f;
  background:#0b1d30;
  color:#d9f6ff;
  font-weight:800;
  cursor:pointer;
  font-size:13px;
}

.tab-btn.active{
  background:linear-gradient(120deg,#087fa5,#6653bf);
  color:#fff;
  border-color:#26d9f0;
}

.previewbox{
  background:#030914;
  padding:14px;
  border-radius:20px;
}

#prompt{
  min-height:320px;
  background:#020b16;
  color:#9ef4ff;
  border-color:#24516c;
  line-height:1.5;
  font-size:13px;
}

.sim-area{
  margin-top:16px;
  background:#0b1d30;
  border:2px dashed #34728f;
  border-radius:18px;
  padding:14px;
  text-align:center;
}

.canvas-container{
  position:relative;
  width:100%;
  max-width:260px;
  height:360px;
  margin:10px auto;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 8px 20px rgba(0,0,0,0.4);
  background:#030914;
}

#simCanvas{
  width:100%;
  height:100%;
  object-fit:cover;
}

.badge{
  position:absolute;
  top:10px;
  left:10px;
  background:rgba(22,217,232,0.85);
  color:#030914;
  padding:4px 10px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
  backdrop-filter:blur(4px);
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

button{
  padding:10px;
  border:0;
  border-radius:12px;
  font-weight:800;
  cursor:pointer;
  font-size:13px;
  transition:transform 0.1s, background 0.2s;
}

button:active{
  transform:scale(0.98);
}

.primary{
  background:linear-gradient(135deg,#16d9e8,#8c7bff);
  color:#fff;
  box-shadow:0 4px 12px #16d9e840;
}

.secondary{
  background:#18364d;
  color:#b8f5ff;
}

.success{
  background:#28a745;
  color:#fff;
}

.dark{
  background:#342d69;
  color:#fff;
}

@media(max-width:1000px){
  .app{ grid-template-columns:1fr; }
  .preview{ position:static; }
}

@media(max-width:600px){
  .grid{ grid-template-columns:1fr; }
  .panel{ padding:16px; }
}
</style>
</head>

      list.push(`${baseRoles[i]}｜${baseDetails[j]}`);
      if (list.length >= maxCount) break;

    if (list.length >= maxCount) break;

  return list;
}

  bodyType: buildOptions(bodyTypes, ["全身比例協調", "線條俐落符合人體工學", "關節結構清晰可見", "動態敏捷且流暢"], 120),

};

// 填入所有下拉選單
function initSelects() {
  for (let key in OPTIONS_DB) {
    const el = document.getElementById(key);
    if (!el) continue;
    el.innerHTML = '';
    OPTIONS_DB[key].forEach((item, index) => {
      const opt = document.createElement('option');
      opt.value = item;
      opt.textContent = `${index + 1}. ${item}`;
      el.appendChild(opt);
    });
  }
}

const get = id => {
  const el = document.getElementById(id);
  return el ? el.value.trim() : '';
};

const checked = () => [...document.querySelectorAll('.check input:checked')].map(x => x.value);

let currentTab = 'img';

function switchTab(tab){
  currentTab = tab;
  document.getElementById('tabImg').classList.toggle('active', tab === 'img');
  document.getElementById('tabVid').classList.toggle('active', tab === 'vid');
  makePrompt();
}

function makePrompt(){
  const song = get('song') || '星際量子電音';
  const options = checked();
  const techEra = get('techEra');
  const alienCiv = get('alienCiv');

  if(currentTab === 'img'){
    const lines = [
      '【階段 1：硬科幻未來科技角色圖像 Prompt (Text-to-Image)】',
      '（適用於 Midjourney / DALL-E / Stable Diffusion XL）',
      '',
      '【世界觀與角色設定】',
      `・文明紀元：${techEra}`,
      `・外星文明：${alienCiv}`,
      '・人物氣質：' + get('gender'),
      '・臉部五官：' + get('faceShape'),
      '・髮型髮色：' + get('hairStyle'),
      '・身形義體：' + get('bodyType'),
      '・未來服裝：' + get('outfit'),
      '・視覺風格：' + get('artStyle'),
      '・未來場景：' + get('scene'),
      '・畫面規格：' + get('ratio') + ' 頂級硬科幻概念圖，UE5 渲染，8k 解析度。',
      get('custom') ? '・自訂擴充：' + get('custom') : '',
      '',
      '【AI 繪圖指令】',
      `${get('gender')}, ${get('faceShape')}, ${get('hairStyle')}, ${get('outfit')}, ${get('scene')}, ${get('artStyle')}, ${techEra}, ${alienCiv}, masterpiece, best quality, ultra-detailed sci-fi concept art, cinematic lighting, ray tracing, 8k --ar 9:16`
    ];
    document.getElementById('prompt').value = lines.join('\n');
  } else {
    const lines = [
      '【階段 2：未來角色圖轉影片 Prompt (Image-to-Video)】',
      '（適用於 Kling / Runway Gen-3 / Luma）',
      '',
      '【動態與音樂表演指令】',
      '・音樂風格：' + get('musicType') + ' (' + get('beat') + ')',
      '・舞蹈動作：' + get('dance') + ' (' + get('dancePower') + ')。',
      '・運鏡風格：' + get('camera'),
      '・物理與特效：' + (options.length ? options.join('；') : '量子瞬移與機械變形') + '。',
      '・品質維持：維持人物臉孔與人種特徵一致；物理動態自然、無閃爍變形。'
    ];
    document.getElementById('prompt').value = lines.join('\n');

}

function randomizeCharacter(){
  ['gender', 'faceShape', 'hairStyle', 'bodyType', 'outfit', 'artStyle'].forEach(key => {
    const sel = document.getElementById(key);
    if(sel && sel.options.length) sel.selectedIndex = Math.floor(Math.random() * sel.options.length);
  });
  makePrompt();
}

function randomizeAll(){
  randomizeCharacter();
  ['musicType', 'dance', 'scene', 'techEra', 'alienCiv', 'camera', 'beat', 'dancePower'].forEach(key => {
    const sel = document.getElementById(key);
    if(sel && sel.options.length) sel.selectedIndex = Math.floor(Math.random() * sel.options.length);
  });
  makePrompt();
}

/* Canvas 模擬預覽 */
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
let currentImgData = null;
let animTimer = null;

function initCanvas(){
  ctx.fillStyle = "#030914";
  ctx.fillRect(0,0,260,360);
  ctx.fillStyle = "#16d9e8";
  ctx.font = "bold 13px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("🌌 點擊「生成角色圖像」", 130, 170);
  ctx.fillText("啟動硬科幻全息預覽", 130, 195);
}

function generateImage(){
  if(animTimer) clearInterval(animTimer);
  document.getElementById('simBadge').textContent = "1. 角色圖像已生成";
  
  ctx.fillStyle = "#071727";
  ctx.fillRect(0,0,260,360);
  
  ctx.fillStyle = "#16d9e8";
  for(let i=0; i<25; i++){
    ctx.beginPath();
    ctx.arc(Math.random()*260, Math.random()*360, Math.random()*2, 0, Math.PI*2);
    ctx.fill();
  }

  ctx.fillStyle = "#8c7bff";
  ctx.beginPath();
  ctx.arc(130, 130, 60, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "#0d2033";
  ctx.beginPath();
  ctx.arc(130, 135, 42, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "#16d9e8";
  ctx.beginPath();
  ctx.arc(115, 130, 6, 0, Math.PI*2);
  ctx.arc(145, 130, 6, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "#214b68";
  ctx.fillRect(85, 180, 90, 110);

  ctx.fillStyle = "#32e6ff";
  ctx.beginPath();
  ctx.arc(130, 220, 12, 0, Math.PI*2);
  ctx.fill();

  currentImgData = ctx.getImageData(0, 0, 260, 360);
  document.getElementById('btnAnim').disabled = false;
}

function generateVideo(){
  if(!currentImgData) return;
  document.getElementById('simBadge').textContent = "2. 🎬 量子動態播放中";
  if(animTimer) clearInterval(animTimer);
  
  let frame = 0;
  animTimer = setInterval(() => {
    frame++;
    ctx.putImageData(currentImgData, 0, 0);
    
    ctx.strokeStyle = "rgba(22, 217, 232, 0.6)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(130, 135, 50 + Math.sin(frame*0.2)*6, 0, Math.PI*2);
    ctx.stroke();

    ctx.fillStyle = "#8c7bff";
    for(let i=0; i<4; i++){
      let px = (frame * 6 + i * 60) % 260;
      let py = (360 - (frame * 4 + i * 40) % 360);
      ctx.fillRect(px, py, 3, 3);
    }
  }, 50);
}

document.querySelectorAll('select, input[type=text], textarea, input[type=checkbox]').forEach(el => {
  el.addEventListener('input', makePrompt);
  el.addEventListener('change', makePrompt);
});

document.getElementById('copy').onclick = async () => {
  try {
    await navigator.clipboard.writeText(document.getElementById('prompt').value);
    const btn = document.getElementById('copy');
    btn.textContent = '✓ 已複製當前指令';
    setTimeout(() => { btn.textContent = '📋 複製當前指令'; }, 1500);
  } catch(e) {
    alert('複製失敗，請手動複製右側指令。');
  }
};

document.getElementById('reset').onclick = () => {
  document.querySelectorAll('select').forEach(el => el.selectedIndex = 0);
  document.querySelectorAll('input[type=text], textarea').forEach(el => el.value = '');
  if(animTimer) clearInterval(animTimer);
  initCanvas();
  makePrompt();
};

// 初始化
initSelects();
initCanvas();
makePrompt();
</script>
