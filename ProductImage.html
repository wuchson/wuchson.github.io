<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; }
    .container { max-width: 1300px; margin: 0 auto; }
    header { border-bottom: 1px solid #334155; padding-bottom: 12px; margin-bottom: 20px; }
    h1 { color: #f472b6; font-size: 22px; font-weight: bold; }
    p.sub { color: #94a3b8; font-size: 13px; margin-top: 4px; }
    
    .grid { display: flex; flex-wrap: wrap; gap: 20px; }
    .col-left { flex: 1 1 650px; display: flex; flex-direction: column; gap: 16px; }
    .col-right { flex: 1 1 420px; }
    
    .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 16px; }
    .card-title { font-size: 15px; font-weight: bold; color: #f472b6; border-bottom: 1px solid #334155; padding-bottom: 8px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 4px; }
    select, input, textarea { width: 100%; background-color: #0f172a; border: 1px solid #475569; border-radius: 6px; padding: 8px; color: #ffffff; font-size: 13px; outline: none; }
    select:focus, input:focus, textarea:focus { border-color: #f472b6; }
    
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
    
    .btn { background-color: #db2777; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
    .btn:hover { background-color: #be185d; }
    .btn-copy { width: 100%; padding: 12px; font-size: 15px; margin-top: 12px; background-color: #db2777; }
    
    .tag-container { display: flex; flex-wrap: wrap; gap: 6px; max-height: 180px; overflow-y: auto; background-color: #0f172a; padding: 10px; border-radius: 6px; border: 1px solid #334155; }
    .tag-item { display: inline-flex; align-items: center; font-size: 12px; background-color: #1e293b; border: 1px solid #475569; padding: 4px 8px; border-radius: 4px; cursor: pointer; color: #cbd5e1; }
    .tag-item input { width: auto; margin-right: 5px; }
    
    textarea.prompt-box { width: 100%; height: 520px; font-family: monospace; font-size: 13px; color: #6ee7b7; background-color: #020617; border: 1px solid #334155; line-height: 1.5; resize: vertical; }
  </style>
</head>
