<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 萌系男生動物唱跳 MV 指令生成器 (圖生影版)</title>

<style>
:root{
  --pink:#1e293b;
  --pink2:#94a3b8;
  --bg:#f1f5f9;
  --line:#cbd5e1;
  --ink:#172033;
  --dark:#0f172a;
  --accent:#334155;
}
*{box-sizing:border-box}

body{
  margin:0;
  font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;
  background:linear-gradient(135deg,#f8fafc,#e2e8f0);
  color:var(--ink);
}

header{
  background:linear-gradient(120deg,#0f172a,#475569);
  color:white;
  padding:24px 20px;
  text-align:center;
}

.wrap{
  max-width:1300px;
  margin:auto;
}

h1{
  margin:0;
  font-size:26px;
}

header p{
  margin:8px 0 0;
  opacity:.95;
  font-size:14px;
}

.app{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px;
  padding:24px 20px 42px;
}

.panel{
  background:#ffffff;
  border:2px solid var(--line);
  border-radius:24px;
  padding:22px;
  box-shadow:0 10px 30px #0f172a12;
}

.title{
  font-size:18px;
  font-weight:800;
  margin:12px 0 16px;
  padding-bottom:8px;
  border-bottom:2px dashed #cbd5e1;
  color:#2563eb;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.group{
  margin-bottom:16px;
}

label{
  display:block;
  font-weight:800;
  margin-bottom:6px;
  font-size:13px;
  color:#334155;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

select,
input[type=text],
textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px 12px;
  background:#f8fafc;
  font:inherit;
  color:var(--ink);
  font-size:13px;
}

textarea{
  resize:vertical;
}

.checks{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.check{
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 12px;
  background:#eef5ff;
  border:1px solid var(--line);
  border-radius:999px;
  font-size:12px;
}

.check input{
  accent-color:var(--pink);
}

.preview{
  position:sticky;
  top:16px;
}

.tab-btn-group{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}

.tab-btn{
  flex:1;
  padding:10px;
  border-radius:12px;
  border:2px solid var(--pink2);
  background:#fff;
  color:var(--ink);
  font-weight:800;
  cursor:pointer;
  font-size:13px;
}

.tab-btn.active{
  background:var(--pink);
  color:#fff;
  border-color:var(--pink);
}

.previewbox{
  background:var(--dark);
  padding:14px;
  border-radius:20px;
}

#prompt{
  min-height:300px;
  background:#08111f;
  color:#dbeafe;
  border-color:#1e3a5f;
  line-height:1.5;
  font-size:13px;
}

/* 模擬生成 Canvas 區域 */
.sim-area{
  margin-top:16px;
  background:#eff6ff;
  border:2px dashed var(--pink2);
  border-radius:18px;
  padding:14px;
  text-align:center;
}

.canvas-container{
  position:relative;
  width:100%;
  max-width:260px;
  height:360px;
  margin:10px auto;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 8px 20px rgba(0,0,0,0.15);
  background:#222;
}

#simCanvas{
  width:100%;
  height:100%;
  object-fit:cover;
}

.badge{
  position:absolute;
  top:10px;
  left:10px;
  background:rgba(30,41,59,0.88);
  color:#fff;
  padding:4px 10px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
  backdrop-filter:blur(4px);
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

button{
  padding:10px;
  border:0;
  border-radius:12px;
  font-weight:800;
  cursor:pointer;
  font-size:13px;
  transition:transform 0.1s, background 0.2s;
}

button:active{
  transform:scale(0.98);
}

.primary{
  background:linear-gradient(135deg,var(--pink),var(--pink2));
  color:#fff;
  box-shadow:0 4px 12px #3b82f640;
}

.secondary{
  background:#eef5ff;
  color:#2563eb;
}

.success{
  background:#28a745;
  color:#fff;
}

.dark{
  background:#172554;
  color:#fff;
}

@media(max-width:1000px){
  .app{ grid-template-columns:1fr; }
  .preview{ position:static; }
}

@media(max-width:600px){
  .grid{ grid-template-columns:1fr; }
}
</style>
</head>

<body>

<header>
<div class="wrap">
<h1>⚡ AI 男生動物潮流唱跳 MV 生成器（先圖後影版）</h1>
<p>先生成高畫質擬人動物男生角色圖，再轉為動態唱跳 MV；保留物種特徵、動物耳朵、尾巴、毛色與服裝一致性。</p>
</div>
</header>

<div class="wrap app">

<main class="panel">

<!-- 一鍵靈感 -->
<div style="background:#eef5ff; border:1px solid #bfdbfe; padding:12px; border-radius:16px; margin-bottom:15px; display:flex; gap:8px;">
  <button class="primary" style="flex:1" onclick="randomizeCharacter()">🎲 隨機動物男生造型</button>
  <button class="secondary" style="flex:1" onclick="randomizeAll()">⚡ 動物潮流全隨機（含舞台與舞蹈）</button>
</div>

<!-- ① 人物造型 -->
<div class="title">
  <span>① 男生動物造型 (繪圖標準設定)</span>
</div>

<div class="grid">
  <div class="group">
    <label>1. 動物角色類型</label>
    <select id="gender"></select>
  </div>
  <div class="group">
    <label>2. 動物臉型特徵</label>
    <select id="faceShape"></select>
  </div>
</div>

<div class="grid">
  <div class="group">
    <label>3. 毛色／毛髮特徵</label>
    <select id="hairStyle"></select>
  </div>
  <div class="group">
    <label>4. 動物身型比例</label>
    <select id="bodyType"></select>
  </div>
</div>

<div class="group">
  <label>5. 男生動物穿搭風格</label>
  <select id="outfit"></select>
</div>

<!-- ② 音樂與唱歌 -->
<div class="title">② 音樂與唱跳風格</div>

<div class="grid">
  <div class="group">
    <label>萌系曲風 (52款)</label>
    <select id="musicType"></select>
  </div>
  <div class="group">
    <label>音樂節奏</label>
    <select id="beat">
      <option value="輕快節奏 (120-135 BPM)，充滿活力的萌系跳躍">輕快活力 (120-135 BPM)</option>
      <option value="中快輕盈 (100-120 BPM)，適合俏皮手勢舞">中快輕盈 (100-120 BPM)</option>
      <option value="軟萌律動 (80-100 BPM)，自然可愛擺動">軟萌律動 (80-100 BPM)</option>
      <option value="夢幻溫柔 (60-80 BPM)，治癒系抒情搖擺">夢幻溫柔 (60-80 BPM)</option>
    </select>
  </div>
</div>

<div class="group">
  <label>指定歌曲名稱/關鍵字 (選填)</label>
  <input id="song" type="text" placeholder="例如：可愛日系動漫歌、抖音熱門萌舞曲……">
</div>

<!-- ③ 美術視覺與舞蹈 -->
<div class="title">③ 美術視覺與潮流舞蹈</div>

<div class="grid">
  <div class="group">
    <label>動物角色美術風格 (10款)</label>
    <select id="artStyle">
      <option value="高質感擬人動物偶像 MV 寫實風，細膩毛髮與電影級打光 (Photorealistic anthropomorphic animal idol MV)">韓系真人偶像 MV 風</option>
      <option value="高質感 3D 擬人動物角色，細膩毛髮與材質 (Premium 3D anthropomorphic animal character)">高質感 3D 男性角色</option>
      <option value="日系動物少年動畫與清爽賽璐璐上色 (Japanese animal-boy anime, clean cel shading)">日系少年漫畫風</option>
      <option value="寫實男性時尚大片，低飽和色調與高級棚拍 (Photorealistic men's fashion editorial, muted tones)">男性時尚大片風</option>
      <option value="街頭潮流視覺，硬朗構圖、顆粒底片與閃光燈 (Urban streetwear editorial, film grain, direct flash)">街頭潮流底片風</option>
      <option value="電影感寫實 3D，冷色輪廓光與體積霧 (Cinematic realistic 3D, cool rim light, volumetric haze)">電影感 3D 風</option>
      <option value="復古港風男星寫真，暖棕底片與復古閃光燈 (Retro Hong Kong male portrait, warm film grain)">復古港風男星寫真</option>
      <option value="極簡高級時裝插畫，黑白灰與俐落線條 (Minimal luxury menswear illustration)">極簡高級時裝插畫</option>
      <option value="潮流遊戲角色概念美術，金屬材質與霓虹光影 (Stylized game character concept art, metallic materials)">潮流遊戲角色概念風</option>
      <option value="清新日系動畫電影風，通透自然光與細膩背景 (Japanese animated film, natural light)">日系動畫電影風</option>
    </select>
  </div>
  <div class="group">
    <label>潮流舞蹈類型 (52款)</label>
    <select id="dance"></select>
  </div>
</div>

<div class="grid">
  <div class="group">
    <label>舞蹈萌度強度</label>
    <select id="dancePower">
      <option value="力量感充足，動作俐落有型">活力帥氣爆棚</option>
      <option value="放鬆自信，帶有街頭感的精準律動">街頭隨性律動</option>
      <option value="清爽沉穩，表情自然、律動流暢">溫柔治癒系</option>
      <option value="充滿舞台能量，步伐明快且落點穩定">元氣少年活力</option>
    </select>
  </div>
  <div class="group">
    <label>舞台與夢幻場景 (52款)</label>
    <select id="scene"></select>
  </div>
</div>

<!-- ④ 鏡頭與表演細節 -->
<div class="title">④ 鏡頭運鏡與動態細節</div>

<div class="grid">
  <div class="group">
    <label>MV 運鏡風格</label>
    <select id="camera">
      <option value="流行潮流 MV 動態運鏡 (眨眼特寫與全景萌舞靈活切換)">潮流 MV 動態運鏡</option>
      <option value="時尚紀實跟拍鏡頭 (Cinematic follow shot, natural confident male presence)">時尚紀實跟拍視角</option>
      <option value="臉部表情與舞蹈手勢交替特寫 (Close-up expressions and precise dance gestures)">表情與手勢交替特寫</option>
      <option value="電影感半環繞運鏡與低角度英雄鏡頭 (Cinematic orbit and subtle low-angle shot)">電影感環繞與低角度</option>
    </select>
  </div>
  <div class="group">
    <label>影片畫面比例</label>
    <select id="ratio">
      <option value="9:16 直式 (TikTok / Shorts / Reels)">9:16 直式</option>
      <option value="16:9 橫式 (YouTube / MV)">16:9 橫式</option>
      <option value="1:1 正方形">1:1 正方形</option>
    </select>
  </div>
</div>

<div class="checks">
  <label class="check"><input type="checkbox" value="嘴型精準呈現歌詞與自然口型 (Accurate male lip-sync)" checked>自然對嘴口型</label>
  <label class="check"><input type="checkbox" value="眼神自信有舞台魅力，與鏡頭自然互動，表情克制不僵硬" checked>自信眼神與鏡頭互動</label>
  <label class="check"><input type="checkbox" value="表情自然有層次，可自信微笑或沉穩凝視，避免過度賣萌" checked>自然表情與男性魅力</label>
  <label class="check"><input type="checkbox" value="頭髮與服裝隨身體擺動產生自然流動的真實物理效果" checked>自然髮絲與服裝物理</label>
  <label class="check"><input type="checkbox" value="副歌呈現俐落手勢、卡點定格與街舞招牌動作，手部不遮住臉部" checked>俐落招牌手勢舞</label>
</div>

<!-- ⑤ 自訂 -->
<div class="title">⑤ 額外補充說明</div>
<textarea id="custom" rows="2" placeholder="例如：狼耳、蓬鬆尾巴、爪掌造型、銀色耳環、麥克風、刺繡外套、舞台煙霧……"></textarea>

</main>

<!-- 右側 Prompt 與模擬生成區 -->
<aside class="panel preview">

<!-- 頁籤切換 -->
<div class="tab-btn-group">
  <button class="tab-btn active" id="tabImg" onclick="switchTab('img')">📷 階段 1：生成照片 Prompt</button>
  <button class="tab-btn" id="tabVid" onclick="switchTab('vid')">🎬 階段 2：圖轉影片 Prompt</button>
</div>

<div class="previewbox">
  <textarea id="prompt" readonly></textarea>
</div>

<!-- 模擬 AI 先圖後影互動區 -->
<div class="sim-area">
  <div style="font-weight:bold; font-size:14px; margin-bottom:8px; color:#2563eb;">⚡ 先圖後影：一鍵體驗流程</div>
  
  <div class="canvas-container">
    <canvas id="simCanvas" width="260" height="360"></canvas>
    <div class="badge" id="simBadge">1. 等待生成圖片</div>
  </div>

  <div style="display:flex; gap:6px; margin-top:8px;">
    <button class="primary" style="flex:1;" onclick="generateImage()">🖼️ 步驟 1：生成角色照片</button>
    <button class="success" style="flex:1;" id="btnAnim" onclick="generateVideo()" disabled>🎥 步驟 2：自動生成 MV 影片</button>
  </div>
  <div style="margin-top:6px;">
    <input type="file" id="customImgUpload" accept="image/*" style="display:none;" onchange="loadCustomImage(event)">
    <button class="secondary" style="width:100%; font-size:11px; padding:6px;" onclick="document.getElementById('customImgUpload').click()">📤 或上傳您自己生成的男生動物圖片</button>
  </div>
</div>

<div class="actions">
  <button class="primary" id="copy">📋 複製當前指令</button>
  <button class="secondary" id="save">💾 儲存設定</button>
  <button class="secondary" id="exportSettings">📤 匯出設定</button>
  <button class="secondary" id="importSettings">📥 匯入設定</button>
  <input id="importFile" type="file" accept=".json,application/json" style="display:none">
  <button class="dark" id="reset" style="grid-column: span 2;">↺ 重設所有設定</button>
</div>

</aside>

</div>

let currentTab = 'img';

function initOptions(){
  for(let key in OPTIONS_DB){
    const select = document.getElementById(key);
    if(!select) continue;
    select.innerHTML = "";
    OPTIONS_DB[key].forEach((item, index) => {
      const opt = document.createElement('option');
      opt.value = item;
      opt.textContent = `${index + 1}. ${item}`;
      select.appendChild(opt);
    });
  }
}

const get = id => document.getElementById(id).value.trim();
const checked = () => [...document.querySelectorAll('.check input:checked')].map(x=>x.value);

}

/* 隨機抽籤功能 */
function randomizeCharacter(){
  ['gender', 'faceShape', 'hairStyle', 'bodyType', 'outfit', 'artStyle'].forEach(key => {
    const sel = document.getElementById(key);
    if(sel){
      sel.selectedIndex = Math.floor(Math.random() * sel.options.length);
    }
  });
  makePrompt();
}

function randomizeAll(){
  randomizeCharacter();
  ['musicType', 'dance', 'scene'].forEach(key => {
    const sel = document.getElementById(key);
    if(sel){
      sel.selectedIndex = Math.floor(Math.random() * sel.options.length);
    }
  });
  makePrompt();
}

/* Canvas 模擬 AI 生成圖片與動畫機制 */
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
let currentImgData = null;
let animTimer = null;
let isAnimating = false;

// 初始化畫布
function initCanvas(){
  ctx.fillStyle = "#eef5ff";
  ctx.fillRect(0,0,260,360);
  ctx.fillStyle = "#334155";
  ctx.font = "bold 14px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("⚡ 點擊下方「生成角色照片」", 130, 170);
  ctx.fillText("體驗先圖後影 MV 流程", 130, 195);
}

function generateImage(){
  if(isAnimating) stopAnimation();
  document.getElementById('simBadge').textContent = "1. 已生成角色圖片";
  
  // 繪製模擬的 AI 萌系美少年卡片
  ctx.fillStyle = "#ffdae3";
  ctx.fillRect(0,0,260,360);
  
  // 背景星光裝飾
  ctx.fillStyle = "#ffffff";
  for(let i=0; i<15; i++){
    ctx.beginPath();
    ctx.arc(Math.random()*260, Math.random()*360, Math.random()*3+1, 0, Math.PI*2);
    ctx.fill();
  }

  // 美少年頭髮
  ctx.fillStyle = "#1e293b";
  ctx.beginPath();
  ctx.arc(130, 130, 75, 0, Math.PI*2);
  ctx.fill();

  // 臉型
  ctx.fillStyle = "#fff0e6";
  ctx.beginPath();
  ctx.arc(130, 140, 50, 0, Math.PI*2);
  ctx.fill();

  // 腮紅
  ctx.fillStyle = "#cbd5e1";
  ctx.beginPath();
  ctx.arc(105, 150, 10, 0, Math.PI*2);
  ctx.arc(155, 150, 10, 0, Math.PI*2);
  ctx.fill();

  // 眼睛
  ctx.fillStyle = "#3d242b";
  ctx.beginPath();
  ctx.arc(110, 135, 7, 0, Math.PI*2);
  ctx.arc(150, 135, 7, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.arc(112, 133, 2.5, 0, Math.PI*2);
  ctx.arc(152, 133, 2.5, 0, Math.PI*2);
  ctx.fill();

  // 甜美微笑
  ctx.strokeStyle = "#334155";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(130, 150, 8, 0.1*Math.PI, 0.9*Math.PI);
  ctx.stroke();

  // 男生上衣主體
  ctx.fillStyle = "#475569";
  ctx.beginPath();
  ctx.moveTo(95, 185);
  ctx.lineTo(165, 185);
  ctx.lineTo(185, 290);
  ctx.lineTo(75, 290);
  ctx.closePath();
  ctx.fill();

  // 儲存快照
  currentImgData = ctx.getImageData(0, 0, 260, 360);
  document.getElementById('btnAnim').disabled = false;
}

function generateVideo(){
  if(!currentImgData) return;
  document.getElementById('simBadge').textContent = "2. 🎬 唱跳 MV 播放中";
  stopAnimation();
  
  let frame = 0;
  isAnimating = true;
  
  animTimer = setInterval(() => {
    frame++;
    ctx.putImageData(currentImgData, 0, 0);
    
    // 模擬動態擺動與對嘴效果
    const offsetY = Math.sin(frame * 0.15) * 6;
    const eyeWink = Math.sin(frame * 0.1) > 0.8;
    
    // 清除區域重新繪製擺動頭部
    ctx.fillStyle = "#fff0e6";
    ctx.beginPath();
    ctx.arc(130, 140 + offsetY, 50, 0, Math.PI*2);
    ctx.fill();

    // 腮紅
    ctx.fillStyle = "#cbd5e1";
    ctx.beginPath();
    ctx.arc(105, 150 + offsetY, 10, 0, Math.PI*2);
    ctx.arc(155, 150 + offsetY, 10, 0, Math.PI*2);
    ctx.fill();

    // 眨眼/大眼
    ctx.fillStyle = "#3d242b";
    if(eyeWink){
      ctx.fillRect(103, 133 + offsetY, 14, 3);
      ctx.beginPath();
      ctx.arc(150, 135 + offsetY, 7, 0, Math.PI*2);
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(110, 135 + offsetY, 7, 0, Math.PI*2);
      ctx.arc(150, 135 + offsetY, 7, 0, Math.PI*2);
      ctx.fill();
    }

    // 萌感嘴型變化 (唱歌對嘴)
    const mouthOpen = Math.abs(Math.sin(frame * 0.2)) * 6 + 3;
    ctx.fillStyle = "#2563eb";
    ctx.beginPath();
    ctx.ellipse(130, 155 + offsetY, 6, mouthOpen, 0, 0, Math.PI*2);
    ctx.fill();

    // 飄落愛心特效
    ctx.fillStyle = "rgba(96, 165, 250, 0.7)";
    const heartY = (frame * 4) % 360;
    ctx.beginPath();
    ctx.arc((frame*3)%260, heartY, 6, 0, Math.PI*2);
    ctx.fill();

  }, 50);
}

function stopAnimation(){
  if(animTimer) clearInterval(animTimer);
  isAnimating = false;
}

function loadCustomImage(e){
  const file = e.target.files[0];
  if(!file) return;
  const img = new Image();
  img.onload = () => {
    stopAnimation();
    ctx.drawImage(img, 0, 0, 260, 360);
    currentImgData = ctx.getImageData(0, 0, 260, 360);
    document.getElementById('simBadge').textContent = "1. 自訂圖片已上傳";
    document.getElementById('btnAnim').disabled = false;
  };
  img.src = URL.createObjectURL(file);
}

/* 即時監聽選項 */
document.querySelectorAll('select, input[type=text], textarea, input[type=checkbox]').forEach(el => {
  el.addEventListener('input', makePrompt);
  el.addEventListener('change', makePrompt);
});

/* 複製 Prompt */
document.getElementById('copy').onclick = async () => {
  try {
    await navigator.clipboard.writeText(document.getElementById('prompt').value);
    const btn = document.getElementById('copy');
    btn.textContent = '✓ 已複製當前指令';
    setTimeout(() => { btn.textContent = '📋 複製當前指令'; }, 1500);
  } catch(e) {
    alert('複製失敗，請手動複製右側指令。');
  }
};

/* 儲存/匯出/匯入/重設 */
function getSettingsData(){
  const data = { version:5, settings:{} };
  document.querySelectorAll('select, input[type=text], textarea').forEach(el => {
    data.settings[el.id] = el.value;
  });
  data.settings.checks = checked();
  return data;
}

document.getElementById('save').onclick = () => {
  localStorage.setItem('danceMVGenerator_img2vid', JSON.stringify(getSettingsData()));
  alert('男生動物造型設定已儲存！');
};

document.getElementById('exportSettings').onclick = () => {
  const blob = new Blob([JSON.stringify(getSettingsData(), null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'Cute_Animal_Boy_MV_ImageToVideo_Settings.json';
  a.click();
  URL.revokeObjectURL(url);
};

document.getElementById('importSettings').onclick = () => document.getElementById('importFile').click();

document.getElementById('importFile').addEventListener('change', function(){
  const file = this.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const raw = JSON.parse(reader.result);
      const data = raw.settings || raw;
      Object.keys(data).forEach(id => {
        const el = document.getElementById(id);
        if(el && id !== 'checks') el.value = data[id];
      });
      makePrompt();
      alert('男生動物造型設定匯入成功！');
    } catch(e) { alert('格式錯誤。'); }
  };
  reader.readAsText(file);
});

document.getElementById('reset').onclick = () => {
  if(!confirm('確定要重設為初始男生動物設定嗎？')) return;
  document.querySelectorAll('select').forEach(el => el.selectedIndex = 0);
  document.querySelectorAll('input[type=text], textarea').forEach(el => el.value = '');
  stopAnimation();
  initCanvas();
  makePrompt();
};

/* 啟動 */
initOptions();
initCanvas();
makePrompt();
</script>
