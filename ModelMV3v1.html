<style>

*{box-sizing:border-box}

body{

header{

}

.wrap{

h1{

}

header p{

}

.app{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px;
  padding:24px 20px 42px;
}

.panel{

  border:2px solid var(--line);

  padding:22px;
  box-shadow:0 10px 30px #ff6b9515;
}

.title{
  font-size:18px;
  font-weight:800;
  margin:12px 0 16px;
  padding-bottom:8px;
  border-bottom:2px dashed #f7d6e0;
  color:#e04872;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.group{
  margin-bottom:16px;
}

label{
  display:block;
  font-weight:800;
  margin-bottom:6px;
  font-size:13px;
  color:#522835;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

select,
input[type=text],
textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px 12px;
  background:#fff5f7;
  font:inherit;
  color:var(--ink);
  font-size:13px;
}

textarea{
  resize:vertical;
}

.checks{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.check{
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 12px;
  background:#fff0f3;
  border:1px solid var(--line);
  border-radius:999px;
  font-size:12px;
}

.check input{
  accent-color:var(--pink);
}

.preview{
  position:sticky;
  top:16px;
}

.tab-btn-group{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}

.tab-btn{
  flex:1;
  padding:10px;
  border-radius:12px;
  border:2px solid var(--pink2);
  background:#fff;
  color:var(--ink);
  font-weight:800;
  cursor:pointer;
  font-size:13px;
}

.tab-btn.active{
  background:var(--pink);
  color:#fff;
  border-color:var(--pink);
}

.previewbox{
  background:var(--dark);
  padding:14px;
  border-radius:20px;
}

#prompt{
  min-height:320px;
  background:#1a080d;
  color:#ffdeeb;
  border-color:#5e2233;
  line-height:1.55;
  font-size:13px;
}

/* 模擬生成 Canvas 區域 */
.sim-area{
  margin-top:16px;
  background:#fff0f4;
  border:2px dashed var(--pink2);
  border-radius:18px;
  padding:14px;
  text-align:center;
}

.canvas-container{
  position:relative;
  width:100%;
  max-width:260px;
  height:360px;
  margin:10px auto;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 8px 20px rgba(0,0,0,0.15);
  background:#222;
}

#simCanvas{
  width:100%;
  height:100%;
  object-fit:cover;
}

.badge{
  position:absolute;
  top:10px;
  left:10px;
  background:rgba(255,107,149,0.85);
  color:#fff;
  padding:4px 10px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
  backdrop-filter:blur(4px);
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

button{
  padding:10px;
  border:0;
  border-radius:12px;
  font-weight:800;
  cursor:pointer;
  font-size:13px;
  transition:transform 0.1s, background 0.2s;
}

button:active{
  transform:scale(0.98);
}

.primary{
  background:linear-gradient(135deg,var(--pink),var(--pink2));
  color:#fff;
  box-shadow:0 4px 12px #ff6b9540;
}

.secondary{
  background:#ffeef2;
  color:#c73860;
}

.success{
  background:#28a745;
  color:#fff;
}

.dark{
  background:#4a1928;
  color:#fff;
}

@media(max-width:1000px){
  .app{ grid-template-columns:1fr; }
  .preview{ position:static; }
}

@media(max-width:600px){
  .grid{ grid-template-columns:1fr; }
}
</style>
</head>

let currentTab = 'img';

function initOptions(){
  for(let key in OPTIONS_DB){
    const select = document.getElementById(key);
    if(!select) continue;
    select.innerHTML = "";
    OPTIONS_DB[key].forEach((item, index) => {
      const opt = document.createElement('option');
      opt.value = item;
      opt.textContent = `${index + 1}. ${item}`;
      select.appendChild(opt);
    });
  }
}

const get = id => document.getElementById(id).value.trim();
const checked = () => [...document.querySelectorAll('.check input:checked')].map(x=>x.value);

function switchTab(tab){
  currentTab = tab;
  document.getElementById('tabImg').classList.toggle('active', tab === 'img');
  document.getElementById('tabVid').classList.toggle('active', tab === 'vid');
  makePrompt();
}

function makePrompt(){

      `${get('artStyle')}, ${cameraText}, ${poseText}, a beautiful girl (${get('gender')}, ${get('faceShape')}, ${get('hairStyle')}, ${get('bodyType')}), wearing ${outfitText}, located in ${sceneText}${get('custom') ? ', ' + get('custom') : ''}, cinematic lighting, ultra-detailed textures, masterpiece, best quality, 8k resolution`

/* 隨機抽籤功能：確保每次點擊都切換成不同的服裝、場景、姿勢與鏡頭 */
function randomizeCharacter(){
  ['gender', 'faceShape', 'hairStyle', 'bodyType', 'outfit', 'artStyle'].forEach(key => {
    const sel = document.getElementById(key);
    if(sel && sel.options.length > 1){
      let nextIdx;
      do {
        nextIdx = Math.floor(Math.random() * sel.options.length);
      } while (nextIdx === sel.selectedIndex);
      sel.selectedIndex = nextIdx;
    }
  });
  makePrompt();
}

function randomizeAll(){
  randomizeCharacter();
  ['musicType', 'dance', 'dancePower', 'scene', 'camera'].forEach(key => {
    const sel = document.getElementById(key);
    if(sel && sel.options.length > 1){
      let nextIdx;
      do {
        nextIdx = Math.floor(Math.random() * sel.options.length);
      } while (nextIdx === sel.selectedIndex);
      sel.selectedIndex = nextIdx;
    }
  });
  makePrompt();
}

/* Canvas 模擬 AI 生成圖片與動畫機制（會根據選擇的場景與服裝變換色調預覽） */
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
let currentImgData = null;
let animTimer = null;
let isAnimating = false;

function initCanvas(){
  ctx.fillStyle = "#ffeef2";
  ctx.fillRect(0,0,260,360);
  ctx.fillStyle = "#ff6b95";
  ctx.font = "bold 14px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("✨ 點擊下方「生成角色照片」", 130, 170);
  ctx.fillText("預覽當前場景與服裝配色", 130, 195);
}

function generateImage(){
  if(isAnimating) stopAnimation();
  document.getElementById('simBadge').textContent = "1. 已生成角色圖片";
  
  const sceneVal = get('scene');
  const outfitVal = get('outfit');

  // 根據場景動態調整背景色系
  let bgGrad = ctx.createLinearGradient(0, 0, 0, 360);
  if(sceneVal.includes('海邊') || sceneVal.includes('海岸')){
    bgGrad.addColorStop(0, "#87CEFA");
    bgGrad.addColorStop(0.6, "#E0F7FA");
    bgGrad.addColorStop(1, "#F4E1B1"); // 沙灘金
  } else if(sceneVal.includes('禮堂') || sceneVal.includes('教堂')){
    bgGrad.addColorStop(0, "#FFF8E7");
    bgGrad.addColorStop(1, "#F3D1DC");
  } else if(sceneVal.includes('星空') || sceneVal.includes('舞台')){
    bgGrad.addColorStop(0, "#2B1055");
    bgGrad.addColorStop(1, "#7597DE");
  } else {
    bgGrad.addColorStop(0, "#FFD1DC");
    bgGrad.addColorStop(1, "#FFF0F5");
  }
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0,0,260,360);
  
  // 背景光斑裝飾
  ctx.fillStyle = "rgba(255,255,255,0.7)";
  for(let i=0; i<18; i++){
    ctx.beginPath();
    ctx.arc(Math.random()*260, Math.random()*360, Math.random()*4+1, 0, Math.PI*2);
    ctx.fill();
  }

  // 美少女頭髮
  ctx.fillStyle = "#ff7597";
  ctx.beginPath();
  ctx.arc(130, 130, 75, 0, Math.PI*2);
  ctx.fill();

  // 臉型
  ctx.fillStyle = "#fff0e6";
  ctx.beginPath();
  ctx.arc(130, 140, 50, 0, Math.PI*2);
  ctx.fill();

  // 腮紅
  ctx.fillStyle = "#ffb3c6";
  ctx.beginPath();
  ctx.arc(105, 150, 10, 0, Math.PI*2);
  ctx.arc(155, 150, 10, 0, Math.PI*2);
  ctx.fill();

  // 眼睛
  ctx.fillStyle = "#3d242b";
  ctx.beginPath();
  ctx.arc(110, 135, 7, 0, Math.PI*2);
  ctx.arc(150, 135, 7, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.arc(112, 133, 2.5, 0, Math.PI*2);
  ctx.arc(152, 133, 2.5, 0, Math.PI*2);
  ctx.fill();

  // 甜美微笑
  ctx.strokeStyle = "#e04872";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(130, 150, 8, 0.1*Math.PI, 0.9*Math.PI);
  ctx.stroke();

  // 根據服裝切換服飾顏色與造型
  if(outfitVal.includes('泳裝')){
    ctx.fillStyle = "#00B4D8";
    ctx.fillRect(102, 195, 56, 22);
    ctx.fillRect(105, 245, 50, 20);
  } else if(outfitVal.includes('晚禮服') || outfitVal.includes('婚紗')){
    ctx.fillStyle = outfitVal.includes('純白') || outfitVal.includes('婚紗') ? "#FFFFFF" : "#F72585";
    ctx.beginPath();
    ctx.moveTo(95, 185);
    ctx.lineTo(165, 185);
    ctx.lineTo(210, 340);
    ctx.lineTo(50, 340);
    ctx.closePath();
    ctx.fill();
  } else {
    ctx.fillStyle = "#ff477e";
    ctx.beginPath();
    ctx.moveTo(95, 185);
    ctx.lineTo(165, 185);
    ctx.lineTo(185, 290);
    ctx.lineTo(75, 290);
    ctx.closePath();
    ctx.fill();
  }

  // 儲存快照
  currentImgData = ctx.getImageData(0, 0, 260, 360);
  document.getElementById('btnAnim').disabled = false;
}

function generateVideo(){
  if(!currentImgData) return;
  document.getElementById('simBadge').textContent = "2. 🎬 唱跳 MV 播放中";
  stopAnimation();
  
  let frame = 0;
  isAnimating = true;
  
  animTimer = setInterval(() => {
    frame++;
    ctx.putImageData(currentImgData, 0, 0);
    
    const offsetY = Math.sin(frame * 0.15) * 6;
    const eyeWink = Math.sin(frame * 0.1) > 0.8;
    
    ctx.fillStyle = "#fff0e6";
    ctx.beginPath();
    ctx.arc(130, 140 + offsetY, 50, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "#ffb3c6";
    ctx.beginPath();
    ctx.arc(105, 150 + offsetY, 10, 0, Math.PI*2);
    ctx.arc(155, 150 + offsetY, 10, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "#3d242b";
    if(eyeWink){
      ctx.fillRect(103, 133 + offsetY, 14, 3);
      ctx.beginPath();
      ctx.arc(150, 135 + offsetY, 7, 0, Math.PI*2);
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(110, 135 + offsetY, 7, 0, Math.PI*2);
      ctx.arc(150, 135 + offsetY, 7, 0, Math.PI*2);
      ctx.fill();
    }

    const mouthOpen = Math.abs(Math.sin(frame * 0.2)) * 6 + 3;
    ctx.fillStyle = "#e04872";
    ctx.beginPath();
    ctx.ellipse(130, 155 + offsetY, 6, mouthOpen, 0, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "rgba(255, 107, 149, 0.7)";
    const heartY = (frame * 4) % 360;
    ctx.beginPath();
    ctx.arc((frame*3)%260, heartY, 6, 0, Math.PI*2);
    ctx.fill();

  }, 50);
}

function stopAnimation(){
  if(animTimer) clearInterval(animTimer);
  isAnimating = false;
}

function loadCustomImage(e){
  const file = e.target.files[0];
  if(!file) return;
  const img = new Image();
  img.onload = () => {
    stopAnimation();
    ctx.drawImage(img, 0, 0, 260, 360);
    currentImgData = ctx.getImageData(0, 0, 260, 360);
    document.getElementById('simBadge').textContent = "1. 自訂圖片已上傳";
    document.getElementById('btnAnim').disabled = false;
  };
  img.src = URL.createObjectURL(file);
}

    setTimeout(() => { btn.textContent = '📋 複製當前指令'; }, 1500);
  } catch(e) {
    alert('複製失敗，請手動複製右側指令。');
  }
};

/* 儲存/匯出/匯入/重設 */
function getSettingsData(){
  const data = { version:7, settings:{} };
  document.querySelectorAll('select, input[type=text], textarea').forEach(el => {
    data.settings[el.id] = el.value;
  });
  data.settings.checks = checked();
  return data;
}

document.getElementById('save').onclick = () => {
  localStorage.setItem('danceMVGenerator_img2vid_v7', JSON.stringify(getSettingsData()));
  alert('多變 MV 設定已儲存！');
};

document.getElementById('exportSettings').onclick = () => {
  const blob = new Blob([JSON.stringify(getSettingsData(), null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'Cute_Girl_MV_Diverse_Settings.json';
  a.click();
  URL.revokeObjectURL(url);
};

document.getElementById('importSettings').onclick = () => document.getElementById('importFile').click();

document.getElementById('importFile').addEventListener('change', function(){
  const file = this.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const raw = JSON.parse(reader.result);
      const data = raw.settings || raw;
      Object.keys(data).forEach(id => {
        const el = document.getElementById(id);
        if(el && id !== 'checks') el.value = data[id];
      });
      makePrompt();
      alert('設定匯入成功！');
    } catch(e) { alert('格式錯誤。'); }
  };
  reader.readAsText(file);
});

document.getElementById('reset').onclick = () => {
  if(!confirm('確定要重設為初始設定嗎？')) return;
  document.querySelectorAll('select').forEach(el => el.selectedIndex = 0);
  document.querySelectorAll('input[type=text], textarea').forEach(el => el.value = '');
  stopAnimation();
  initCanvas();
  makePrompt();
};

/* 啟動 */
initOptions();
initCanvas();
makePrompt();
</script>
