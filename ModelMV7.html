<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中國古裝武俠影視生成器</title>
<style>
:root{--a:#a52c30;--b:#d7b574;--bg:#f5efe4;--ink:#32251c;--panel:#fffdf8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei",sans-serif}
header{padding:24px 16px;text-align:center;color:#fff;background:linear-gradient(120deg,#301b19,#87332d,#bd874b)}
header h1{margin:0;font-size:25px}
header p{margin:8px 0 0;font-size:13px}
.wrap{max-width:1400px;margin:auto}
.app{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:20px}
.panel{background:var(--panel);border:1px solid #dfcba8;border-radius:18px;padding:20px;box-shadow:0 6px 22px #43261612;min-width:0}
.title{font-weight:900;border-bottom:2px solid #dfcba8;padding-bottom:9px;margin:18px 0 14px;color:#87332d}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.group{margin-bottom:13px}
label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}
select,input[type=text],textarea{width:100%;padding:10px;border:1px solid #d9c7ac;border-radius:10px;background:#fffaf1;color:#32251c;font:inherit;font-size:13px}
textarea{resize:vertical;line-height:1.6}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.check{display:flex;align-items:center;gap:5px;background:#f6ecdd;border-radius:20px;padding:8px 10px;font-size:12px}
.check input{accent-color:var(--a)}
button{border:0;border-radius:10px;padding:10px;cursor:pointer;font-weight:800;font-size:13px}
button:active{transform:scale(.98)}
.primary{background:var(--a);color:#fff}
.secondary{background:#eee1ce;color:#51372a}
.dark{background:#30201b;color:#fff}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.preview{position:sticky;top:12px;align-self:start}
.tabs{display:flex;gap:7px;margin-bottom:12px}
.tab{flex:1;background:#eee1ce;color:#51372a}
.tab.active{background:var(--a);color:#fff}
#prompt{min-height:400px;background:#261c18;color:#f7e7c8;border-color:#574138}
.previewbox{background:#261c18;padding:10px;border-radius:13px}
.art{margin-top:14px;background:#f5ead8;border:1px dashed #bd9b69;border-radius:14px;padding:12px;text-align:center}
canvas{width:100%;max-width:300px;height:350px;object-fit:contain;background:#29211d;border-radius:10px;display:block;margin:10px auto}
.small{font-size:11px;line-height:1.6;color:#75614c}
@media(max-width:900px){.app{grid-template-columns:1fr}.preview{position:static}}
@media(max-width:550px){.grid{grid-template-columns:1fr}.app{padding:10px}.panel{padding:14px}}
</style>
</head>
<body>
<header>
<h1>⚔️ 中國古裝武俠影視生成器</h1>
<p>百大仙氣妝髮・頂級粉系絲綢服飾・雲海仙境場景</p>
</header>
<div class="wrap app">
<main class="panel">
<div class="actions" style="margin-top:0">
<button class="primary" onclick="randomCharacter()">🎲 隨機仙氣女俠造型</button>
<button class="secondary" onclick="randomAll()">🎴 隨機仙俠武打劇情</button>
</div>

<div class="title">① 人物與角色設定</div>
<div class="grid">
<div class="group"><label>角色身分</label><select id="role"></select></div>
<div class="group"><label>人物氣質</label><select id="temper"></select></div>
<div class="group"><label>五官與面容</label><select id="face"></select></div>
<div class="group"><label>髮型與髮色</label><select id="hair"></select></div>
<div class="group"><label>身形與姿態</label><select id="body"></select></div>
<div class="group"><label>角色年齡</label><select id="age">
<option>仙氣少女，約 16 至 19 歲 (空靈清純)</option>
<option>妙齡劍仙，約 20 至 25 歲 (超塵脫俗)</option>
<option>成年女俠，約 26 至 35 歲 (清冷成熟)</option>
<option>深山尊者，氣度沉穩不凡</option>
<option>上古神女，不食人間煙火</option>
</select></div>
</div>

<div class="title">② 古裝服飾與兵器</div>
<div class="grid">
<div class="group"><label>服裝款式</label><select id="outfit"></select></div>
<div class="group"><label>服裝主色</label><select id="color"></select></div>
<div class="group"><label>兵器</label><select id="weapon"></select></div>
<div class="group"><label>配件與裝飾</label><select id="accessory"></select></div>
</div>

<div class="title">③ 畫風與人物定妝</div>
<div class="grid">
<div class="group"><label>美術風格</label><select id="style">
<option value="頂級電影級真人寫實仙俠古裝，細膩真實蠶絲布料質感，透光薄紗，微風流動感，自然逆光，柔和電影色調">電影級真人寫實仙俠風</option>
<option value="精緻中國古風動漫，極致細膩的髮絲與飄逸衣袖線條，唯美光影，仙氣飄飄">唯美古風動漫</option>
<option value="高品質3D中國奇幻仙俠角色，細緻絲綢材質與粒子劍氣特效，電影級光影">3D奇幻仙俠電影</option>
<option value="真人寫實與東方水墨美學融合，詩意朦朧電影色調，留白意境">寫實水墨仙境風</option>
</select></div>
<div class="group"><label>人物構圖</label><select id="framing">
<option>全身仙氣定妝照，完整呈現飄逸長裙與劍器</option>
<option>半身空靈肖像，突出精緻五官、花鈿與髮飾</option>
<option>低角度英雄式全身構圖，衣袂迎風飛揚</option>
<option>側身凌空御劍，雲海在腳下翻湧的電影劇照</option>
<option>正面仙子下凡設定圖，整體造型清麗出塵</option>
</select></div>
</div>

<div class="title">④ 江湖場景與環境</div>
<div class="grid">
<div class="group"><label>場景</label><select id="scene"></select></div>
<div class="group"><label>時間與天氣</label><select id="weather">
<option>晨霧繚繞的仙山雲海，柔和金色逆光</option><option>月夜薄霧，冷色月光灑落竹林</option>
<option>落花紛飛，微風帶起花瓣與衣袂</option><option>雨後晴空，彩虹與山間水霧交織</option>
<option>夕陽西下，金色光束穿過浮塵與雲霧</option><option>竹林晴日，斑駁陽光與漂浮光點</option>
<option>雪山之巔，寒風、雪塵與晶瑩冰晶</option><option>深夜幽谷，螢火蟲與微光泛藍</option>
</select></div>
<div class="group"><label>鏡頭與構圖</label><select id="camera">
<option>電影級廣角全景，交代宏大仙山與渺小人物的詩意對比</option>
<option>低角度仰拍，突出女俠御風而行的仙姿</option>
<option>中景跟拍，衣袂與輕紗隨輕功移動流暢飄動</option>
<option>臉部特寫與流光劍器細節切換</option>
<option>環繞人物運鏡，長髮與透明絲綢如流水般飛舞</option>
<option>長鏡頭跟隨御劍飛行，穿梭於雲海之間</option>
<option>高空俯拍懸浮仙山與古老石橋</option>
</select></div>
<div class="group"><label>畫面比例與張數</label><select id="ratio">
<option value="9:16 --c 4">9:16 直式 4張連發 (Grid)</option>
<option value="16:9 --c 4">16:9 電影橫式 4張連發 (Grid)</option>
<option value="1:1 --c 4">1:1 正方形 4張連發 (Grid)</option>
<option value="2.39:1 --c 4">2.39:1 寬銀幕 4張連發 (Grid)</option>
</select></div>
</div>

<div class="title">⑤ 劇情與武打動作</div>
<div class="grid">
<div class="group"><label>劇情類型</label><select id="plot"></select></div>
<div class="group"><label>主要動作</label><select id="action"></select></div>
<div class="group"><label>對手或互動</label><select id="opponent"></select></div>
<div class="group"><label>情緒表演</label><select id="emotion"></select></div>
<div class="group"><label>武打節奏</label><select id="pace">
<option>仙俠飄逸，動作輕靈如燕，劍氣伴隨流光特效</option>
<option>慢動作拔劍，透明絲綢與髮絲在空中優雅定格</option>
<option>輕功騰空，空中轉體，衣袂如雲霞般展開</option>
<option>寫實俐落劍法，重心穩定，招式如行雲流水</option>
<option>沉穩對峙，眼神交鋒後劍氣瞬間激盪</option>
<option>御劍飛行，化作一道流光穿雲破霧</option>
</select></div>
<div class="group"><label>分鏡長度</label><select id="duration">
<option>5 秒，一個完整仙姿動作</option><option>8 秒，兩段劍招銜接</option>
<option>10 秒，含起手運氣、劍氣流轉與收勢</option>
<option>15 秒，完整仙俠短場景</option>
<option>30 秒，多鏡頭仙俠劇情片段</option>
</select></div>
</div>

<div class="title">⑥ 動態細節與一致性</div>
<div class="checks">
<label class="check"><input type="checkbox" value="臉部五官精緻清麗，保持仙氣角色身份一致" checked>固定臉部</label>
<label class="check"><input type="checkbox" value="高定絲綢服裝、層疊薄紗、顏色、髮飾與仙劍全程一致" checked>固定服裝與兵器</label>
<label class="check"><input type="checkbox" value="絲綢衣袂、精緻披帛、長髮絲線依風向與輕功自然飄動，呈現絲滑物理質感" checked>絲綢物理飄動</label>
<label class="check"><input type="checkbox" value="動作符合人體重心與仙俠美學輕盈感" checked>動作流暢</label>
<label class="check"><input type="checkbox" value="仙劍形狀清晰，手部握持劍柄自然準確" checked>兵器穩定</label>
<label class="check"><input type="checkbox" value="頂級電影級景深、體積光、晨霧與逆光透出的絲綢半透明質感" checked>電影光影</label>
<label class="check"><input type="checkbox" value="鏡頭平穩流暢，展現大片級運鏡質感" checked>穩定運鏡</label>
<label class="check"><input type="checkbox" value="生成四張不同角度與微調姿勢的連發畫面 (Grid of 4)" checked>一次生成4張</label>
</div>

<div class="title">⑦ 劇情補充</div>
<div class="group"><label>角色姓名（選填）</label><input id="name" type="text" placeholder="例如：沈清秋、白羽璃、雲岫"></div>
<div class="group"><label>自訂劇情、仙門、招式或台詞</label><textarea id="custom" rows="3" placeholder="例如：青雲仙宗首座弟子，手持上古冰魄神劍，立於雲海之巔參悟太上劍意……"></textarea></div>
</main>

<aside class="panel preview">
<div class="tabs">
<button class="tab active" id="tabImg" onclick="switchTab('img')">🖼️ 人物／場景生圖</button>
<button class="tab" id="tabStory" onclick="switchTab('story')">🎬 劇情分鏡</button>
<button class="tab" id="tabVid" onclick="switchTab('vid')">⚔️ 圖生影片</button>
</div>
<div class="previewbox"><textarea id="prompt" readonly></textarea></div>
<div class="actions">
<button class="primary" onclick="copyPrompt()">📋 複製指令</button>
<button class="secondary" onclick="saveSettings()">💾 儲存設定</button>
<button class="secondary" onclick="exportSettings()">📤 匯出 JSON</button>
<button class="secondary" onclick="document.getElementById('importFile').click()">📥 匯入 JSON</button>
<input id="importFile" type="file" accept=".json,application/json" hidden>
<button class="dark" onclick="resetAll()" style="grid-column:span 2">↺ 重設設定</button>
</div>
<div class="art">
<strong>🖼️ 參考圖片預覽</strong>
<canvas id="canvas" width="300" height="350"></canvas>
<input type="file" id="imageFile" accept="image/*" hidden>
<button class="secondary" onclick="document.getElementById('imageFile').click()">上傳人物或仙境參考圖</button>
<p class="small">此區僅供本機預覽，請複製右側提示詞貼入生成平台。圖生影片請將生成好的仙女圖上傳至該平台。</p>
</div>
</aside>
</div>

let currentTab="img";
const $=id=>document.getElementById(id);
const val=id=>$(id).value;
const selectedChecks=()=>[...document.querySelectorAll('.check input:checked')].map(x=>x.value);

function init(){
 Object.entries(DB).forEach(([id,items])=>{
  const el = $(id);
  if(el && Array.isArray(items)){
   el.innerHTML=items.map((x,i)=>`<option value="${esc(x)}">${i+1}. ${esc(x)}</option>`).join("");
  }
 });
 document.querySelectorAll("select,input[type=text],textarea").forEach(el=>{
  el.addEventListener("input",makePrompt);
  el.addEventListener("change",makePrompt);
 });
 document.querySelectorAll(".check input").forEach(el=>el.addEventListener("change",makePrompt));
 const importEl = $("importFile");
 if(importEl) importEl.addEventListener("change",importSettings);
 const imageEl = $("imageFile");
 if(imageEl) imageEl.addEventListener("change",previewImage);
 drawPlaceholder();
 makePrompt();
}

function esc(s){
 if(typeof s !== 'string') return s;
 return s.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
}

function randomIds(ids){
 ids.forEach(id=>{const e=$(id);if(e && e.options.length)e.selectedIndex=Math.floor(Math.random()*e.options.length);});
}
function randomCharacter(){
 randomIds(["role","temper","face","hair","body","outfit","color","weapon","accessory","style"]);
 makePrompt();
}
function randomAll(){
 randomCharacter();
 randomIds(["scene","weather","camera","plot","action","opponent","emotion","pace","duration","framing"]);
 makePrompt();
}
function identity(){
 return [
  "角色："+(val("name")||"未命名仙氣女俠"),
  "身分："+val("role"),
  "人物氣質："+val("temper"),
  "面容與妝容："+val("face"),
  "年齡設定："+val("age"),
  "髮型與髮色："+val("hair"),
  "身形與姿態："+val("body"),
  "服裝款式："+val("outfit"),
  "服裝主色："+val("color"),
  "配件與飾品："+val("accessory"),
  "兵器與法寶："+val("weapon")
 ].join("\n");
}

 return [
  "美術風格："+val("style"),

  "時間與天氣："+val("weather"),
  "鏡頭構圖："+val("framing"),

  "一致性要求："+selectedChecks().join("；"),
  "補充設定："+(val("custom")||"無"),
  "畫質與質感要求：頂級絲綢半透明質感，精細蠶絲紋理，清晰精緻五官與額間花鈿，完美人體比例，手指與劍柄結構正確，電影級景深與體積光，仙氣縹緲的流光特效，一次生成4張不同角度連發畫面 (Grid of 4 variations)."
 ].join("\n");
}

 const ident=identity();

  text=`【仙氣武俠少女角色／場景生圖提示詞 (四張連發版)】

【人物定妝與仙姿設定】
${ident}

【仙境場景與美術】
${quality}

【英文生成提示詞 (Prompt with Grid 4x)】
Ethereal xianxia heroine, fairy-like martial arts girl, ${val("role")}, ${val("temper")}, ${val("face")}, ${val("hair")}, high-end translucent silk hanfu costume with flowing ethereal ribbons, ${val("color")}, ${val("weapon")}, ${val("scene")}, ${val("weather")}, ${val("style")}, cinematic lighting, backlit translucent silk, glowing sword qi particles, elegant floating martial arts pose, highly detailed silk texture, clear facial features, flawless skin, consistent character design, generation grid of 4 unique variations, aspect ratio ${val("ratio")}.

【負面提示詞 (Negative Prompt)】
low quality, blurry, deformed hands, extra fingers, extra limbs, distorted face, inconsistent costume, broken weapon, modern clothing, modern buildings, text, watermark, logo, heavy makeup, stiff fabric.`;
 }else if(currentTab==="story"){
  text=`【仙氣武俠短劇劇情與分鏡生成指令 (四格分鏡版)】

${ident}

【故事主軸】
${val("plot")}

【仙境場景】
${val("scene")}；${val("weather")}

【主要動作】
${val("action")}

【對手與互動】
${val("opponent")}

【情緒表演】
${val("emotion")}

【鏡頭風格】
${val("camera")}

【四格分鏡規劃 (Grid 4-Panel)】
面板一（起）：遠景交代宏大仙山雲海、天氣與人物御風而行的仙姿。
面板二（承）：中景呈現人物輕功走位、絲綢衣袂隨風飄動與劍器細節。
面板三（轉）：${val("action")}，動作輕靈流暢，劍氣伴隨光效，情緒：${val("emotion")}。
面板四（合）：人物完成招式後凌空收勢，鏡頭定格於充滿詩意的仙俠畫面。

【視覺統一】
${quality}

【補充劇情】
${val("custom")||"請根據仙俠世界觀補足合理的御劍動機與雲海場景細節。"}

請保持人物身份、絲綢服飾、髮型、仙劍與仙境場景方向一致。`;
 }else{
  text=`【圖生影片 Image-to-Video｜仙氣武俠電影動態提示詞】

【參考圖使用規則】
以輸入圖片作為仙氣女俠外觀與初始構圖的唯一視覺基準。精確保留同一張臉、精緻妝容、髮型、絲綢服裝剪裁、半透明薄紗層次、主色、飾品、仙劍外觀與雲海場景。切勿重新設計人物。

【場景與劇情】
${val("plot")}
地點：${val("scene")}
天氣：${val("weather")}
對手：${val("opponent")}

【動作時間軸】
0–2 秒：人物凌空微浮或自然呼吸，絲綢衣袂、披帛與髮絲依風向輕柔飄動，眼神清冷堅定。
2–4 秒：${val("action")}
4–6 秒：動作完成後保持優雅平衡重心，劍柄與手部位置正確，氣場收斂。
影片長度選擇：${val("duration")}。請依所選長度流暢延展仙俠節奏。

【動作與表演】
武打節奏：${val("pace")}
情緒：${val("emotion")}
鏡頭：${val("camera")}
畫面比例：${val("ratio")}

【動態細節】
${selectedChecks().join("；")}
絲綢衣物、透明披帛、長髮絲線與落花雪塵依雲海風向自然飄動，展現絲滑流暢的物理質感。劍氣軌跡清晰，不穿透身體。人物動作流暢，充滿仙俠飄逸美學。

【影視品質限制】
保持單一連貫仙境場景，鏡頭運鏡平穩流暢。不新增多餘人物、不改變絲綢服裝、不更換仙劍、不改變角色面容、不突然切景、不生成字幕或水印。`;

}
function switchTab(tab){
 currentTab=tab;
 ["img","story","vid"].forEach(t=>{
  const btn = $("tab"+(t==="img"?"Img":t==="story"?"Story":"Vid"));
  if(btn) btn.classList.toggle("active",t===tab);
 });
 makePrompt();
}
async function copyPrompt(){
 const text=$("prompt").value;
 try{await navigator.clipboard.writeText(text);alert("提示詞已成功複製！");}
 catch(e){$("prompt").focus();$("prompt").select();alert("請使用複製快捷鍵複製提示詞。");}
}
function getSettings(){
 const data={};
 document.querySelectorAll("select,input[type=text],textarea").forEach(el=>data[el.id]=el.value);
 data.checks=selectedChecks();
 return data;
}
function applySettings(data){
 Object.entries(data).forEach(([id,value])=>{
  if(id==="checks")return;
  const el=$(id);
  if(el)el.value=value;
 });
 document.querySelectorAll(".check input").forEach(el=>el.checked=(data.checks||[]).includes(el.value));
 makePrompt();
}
function saveSettings(){
 try{localStorage.setItem("wuxiaMVSettings",JSON.stringify(getSettings()));alert("設定已儲存於此瀏覽器。");}
 catch(e){alert("無法儲存設定，請使用匯出 JSON。");}
}
function exportSettings(){
 const blob=new Blob([JSON.stringify(getSettings(),null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="WuxiaMV-Flagship-settings.json";a.click();URL.revokeObjectURL(a.href);
}
function importSettings(e){
 const file=e.target.files[0];if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{applySettings(JSON.parse(reader.result));alert("設定匯入成功！");}
  catch(err){alert("檔案格式錯誤，無法匯入。");}
  e.target.value="";
 };
 reader.readAsText(file);
}
function resetAll(){
 if(!confirm("確定要重設所有仙俠武俠設定嗎？"))return;
 document.querySelectorAll("select").forEach(el=>el.selectedIndex=0);
 document.querySelectorAll("input[type=text],textarea").forEach(el=>el.value="");
 document.querySelectorAll(".check input").forEach(el=>el.checked=true);
 currentTab="img";
 switchTab("img");
}
const canvas=$("canvas"),ctx=canvas.getContext("2d");
function drawPlaceholder(){
 if(!ctx) return;
 ctx.fillStyle="#29211d";ctx.fillRect(0,0,300,350);
 ctx.fillStyle="#dfc28d";ctx.textAlign="center";
 ctx.font="bold 18px sans-serif";ctx.fillText("仙氣女俠參考圖預覽",150,150);
 ctx.font="13px sans-serif";ctx.fillText("請上傳定妝照或仙境圖",150,180);
 ctx.fillText("此處僅為本機預覽",150,205);
}
function previewImage(e){
 const file=e.target.files[0];if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  const img=new Image();
  img.onload=()=>{
   ctx.clearRect(0,0,300,350);
   const scale=Math.min(300/img.width,350/img.height);
   const w=img.width*scale,h=img.height*scale;
   ctx.drawImage(img,(300-w)/2,(350-h)/2,w,h);
  };
  img.src=reader.result;
 };
 reader.readAsDataURL(file);
}

// 確保網頁完全載入後執行初始化
window.addEventListener('DOMContentLoaded', init);
